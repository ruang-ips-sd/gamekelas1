<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFD3E0">
<title>📖 Petualangan Membaca - Kelas 1 Ceria</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ====== PREMIUM COLOR SYSTEM ====== */
  :root {
    --bg-1: #FFD3E0;
    --bg-2: #FFE8CC;
    --bg-3: #FFF4D6;
    --bg-4: #E8F4FF;
    --bg-5: #D6F0FF;

    --rose: #FF6B9D;
    --rose-deep: #E84A7F;
    --orange: #FFB347;
    --orange-deep: #E8952E;
    --sky: #7DD3FC;
    --sky-deep: #38BDF8;
    --gold: #F5C542;
    --gold-deep: #D4A017;
    --mint: #5EC4C4;
    --mint-deep: #3AA8A8;
    --lavender: #A78BFA;
    --lavender-deep: #8B5CF6;

    --text: #3D3D5C;
    --text-soft: #6B6B8A;
    --text-muted: #9191A8;

    --shadow-rose: 0 8px 24px rgba(255,107,157,0.25);
    --shadow-orange: 0 8px 24px rgba(255,179,71,0.25);
    --shadow-sky: 0 8px 24px rgba(125,211,252,0.25);
    --shadow-gold: 0 8px 24px rgba(245,197,66,0.3);

    --glass: rgba(255,255,255,0.7);
    --glass-border: rgba(255,255,255,0.9);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    font-family: 'Quicksand', 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg,
      var(--bg-1) 0%,
      var(--bg-2) 15%,
      var(--bg-3) 35%,
      var(--bg-4) 60%,
      var(--bg-5) 80%,
      #FFF2D9 100%);
    background-attachment: fixed;
    min-height: 100dvh;
    color: var(--text);
    overflow-x: hidden;
    position: relative;
    font-weight: 600;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,255,255,0.5) 0%, transparent 30%),
      radial-gradient(circle at 90% 70%, rgba(255,255,255,0.35) 0%, transparent 35%);
    pointer-events: none;
    z-index: 1;
  }
  #app { min-height: 100dvh; display: flex; flex-direction: column; position: relative; z-index: 2; }

  h1, h2, h3, h4 {
    font-family: 'Baloo 2', cursive;
    letter-spacing: -0.3px;
  }

  /* ====== LOADING SCREEN ====== */
  #loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg,
      #FFD3E0 0%,
      #FFE8CC 30%,
      #FFF4D6 55%,
      #E8F4FF 80%,
      #D6F0FF 100%);
    transition: opacity 0.6s ease, visibility 0.6s ease;
    overflow: hidden;
  }
  #loadingScreen::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.7) 0%, transparent 30%),
      radial-gradient(circle at 85% 75%, rgba(255,255,255,0.5) 0%, transparent 35%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.3) 0%, transparent 50%);
    pointer-events: none;
  }
  #loadingScreen.hide { opacity: 0; visibility: hidden; }

  .loader-wrap {
    text-align: center;
    position: relative;
    z-index: 2;
    animation: loaderPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 100%;
    padding: 0 16px;
  }
  @keyframes loaderPop {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .loader-circle {
    position: relative;
    width: clamp(120px, 30vw, 180px);
    height: clamp(120px, 30vw, 180px);
    margin: 0 auto clamp(18px, 4vw, 32px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .loader-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 4px solid transparent;
    border-top-color: #FF6B9D;
    border-right-color: #FFB347;
    animation: ringSpin 1.4s linear infinite;
    filter: drop-shadow(0 4px 12px rgba(255,107,157,0.4));
  }
  .loader-ring-2 {
    inset: 12px;
    border-top-color: #7DD3FC;
    border-right-color: #5EC4C4;
    animation: ringSpin 1.8s linear infinite reverse;
    filter: drop-shadow(0 4px 12px rgba(125,211,252,0.4));
  }
  .loader-ring-3 {
    inset: 24px;
    border-top-color: #F5C542;
    border-right-color: #E8952E;
    animation: ringSpin 2.2s linear infinite;
    filter: drop-shadow(0 4px 12px rgba(245,197,66,0.4));
  }
  @keyframes ringSpin { to { transform: rotate(360deg); } }

  .loader-core {
    position: relative;
    width: 62%;
    height: 62%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%,
      #FFFFFF 0%,
      #FFF4D6 40%,
      #FFD3E0 75%,
      #FFB6D5 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 8px 24px rgba(255,107,157,0.35),
      0 0 0 4px rgba(255,255,255,0.85),
      inset 0 -6px 12px rgba(232,74,127,0.15),
      inset 0 4px 8px rgba(255,255,255,0.9);
    animation: corePulse 1.6s ease-in-out infinite;
  }
  @keyframes corePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .loader-rks {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(1.5rem, 5.5vw, 2.4rem);
    letter-spacing: 1px;
    background: linear-gradient(135deg, #E84A7F 0%, #E8952E 50%, #D4A017 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 2px rgba(255,107,157,0.4));
  }

  .loader-brand {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(0.95rem, 3.8vw, 1.6rem);
    letter-spacing: 1px;
    margin-bottom: clamp(14px, 3vw, 22px);
    display: flex;
    justify-content: center;
    align-items: baseline;
    flex-wrap: wrap;
    filter: none;
  }

  .loader-brand span {
    display: inline-block;
    -webkit-text-stroke: 0.6px rgba(255,255,255,0.9);
    text-shadow:
      0 1px 0 rgba(255,255,255,0.9),
      0 2px 3px rgba(0,0,0,0.12);
    animation: colorBlink 1.4s ease-in-out infinite;
    will-change: color, transform;
  }
  .loader-brand span.space { animation: none; }

  .loader-brand span:nth-child(1)  { color: #E84A7F; animation-delay: 0.0s; }
  .loader-brand span:nth-child(2)  { color: #F0722B; animation-delay: 0.1s; }
  .loader-brand span:nth-child(3)  { color: #E8952E; animation-delay: 0.2s; }
  .loader-brand span:nth-child(4)  { color: #D4A017; animation-delay: 0.3s; }
  .loader-brand span:nth-child(5)  { color: #38BDF8; animation-delay: 0.4s; }
  .loader-brand span:nth-child(6)  { animation-delay: 0.5s; }
  .loader-brand span:nth-child(7)  { color: #2E8B7E; animation-delay: 0.6s; }
  .loader-brand span:nth-child(8)  { color: #0284C7; animation-delay: 0.7s; }
  .loader-brand span:nth-child(9)  { color: #7C3AED; animation-delay: 0.8s; }
  .loader-brand span:nth-child(10) { color: #E84A7F; animation-delay: 0.9s; }
  .loader-brand span:nth-child(11) { animation-delay: 1.0s; }
  .loader-brand span:nth-child(12) { color: #F0722B; animation-delay: 1.1s; }
  .loader-brand span:nth-child(13) { color: #D4A017; animation-delay: 1.2s; }
  .loader-brand span:nth-child(14) { color: #38BDF8; animation-delay: 1.3s; }
  .loader-brand span:nth-child(15) { color: #2E8B7E; animation-delay: 1.4s; }
  .loader-brand span:nth-child(16) { color: #E84A7F; animation-delay: 1.5s; }

  @keyframes colorBlink {
    0%, 100% {
      transform: translateY(0) scale(1);
      filter: brightness(1);
    }
    50% {
      transform: translateY(-3px) scale(1.08);
      filter: brightness(1.25) saturate(1.4);
    }
  }

  .loader-dots {
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .loader-dots span {
    width: clamp(10px, 2.5vw, 14px);
    height: clamp(10px, 2.5vw, 14px);
    border-radius: 50%;
    animation: dotBounce 1.2s ease-in-out infinite;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .loader-dots span:nth-child(1) { background: linear-gradient(135deg, #FF6B9D, #E84A7F); animation-delay: 0s; }
  .loader-dots span:nth-child(2) { background: linear-gradient(135deg, #FFB347, #E8952E); animation-delay: 0.2s; }
  .loader-dots span:nth-child(3) { background: linear-gradient(135deg, #7DD3FC, #38BDF8); animation-delay: 0.4s; }
  @keyframes dotBounce {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.7; }
    50% { transform: translateY(-10px) scale(1.2); opacity: 1; }
  }

  /* ===== ORIENTATION WARNING — PREMIUM ===== */
  .orientation-warning {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9990;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    flex-direction: column;
    font-family: 'Quicksand', sans-serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,182,217,0.45) 0%, transparent 55%),
      radial-gradient(circle at 80% 80%, rgba(167,139,250,0.4) 0%, transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(255,244,214,0.6) 0%, transparent 70%),
      linear-gradient(160deg, #FFD3E0 0%, #FFE8CC 35%, #FFF4D6 60%, #E8F4FF 85%, #D6F0FF 100%);
    overflow: hidden;
    animation: owFadeIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .orientation-warning::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.75) 0%, transparent 30%),
      radial-gradient(circle at 85% 75%, rgba(255,255,255,0.55) 0%, transparent 35%);
    pointer-events: none;
    animation: owShimmer 8s ease-in-out infinite alternate;
  }
  .orientation-warning::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(
      from 0deg,
      rgba(255,107,157,0.15),
      rgba(255,179,71,0.15),
      rgba(245,197,66,0.15),
      rgba(94,196,196,0.15),
      rgba(167,139,250,0.15),
      rgba(255,107,157,0.15)
    );
    animation: owRotate 20s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  .orientation-warning.hidden { display: none !important; }

  @keyframes owFadeIn {
    from { opacity: 0; transform: scale(1.05); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes owShimmer {
    0%   { opacity: 0.7; transform: scale(1); }
    100% { opacity: 1;   transform: scale(1.08); }
  }
  @keyframes owRotate { to { transform: rotate(360deg); } }

  .orientation-warning .ow-content {
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-radius: 32px;
    padding: 34px 26px 28px;
    box-shadow:
      0 0 0 1.5px rgba(255,255,255,0.95) inset,
      0 1px 0 rgba(255,255,255,0.9),
      0 20px 50px rgba(255,107,157,0.28),
      0 8px 20px rgba(167,139,250,0.18),
      0 40px 90px rgba(232,74,127,0.15);
    max-width: 380px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    overflow: hidden;
    animation: owCardIn 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
  }
  .orientation-warning .ow-content::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg,
      var(--rose), var(--orange), var(--gold),
      var(--mint), var(--sky), var(--lavender), var(--rose));
    background-size: 300% 100%;
    animation: owTopBar 4s linear infinite;
    border-radius: 32px 32px 0 0;
  }
  .orientation-warning .ow-content::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% -10%, rgba(255,255,255,0.7) 0%, transparent 60%);
    pointer-events: none;
    border-radius: 32px;
  }
  @keyframes owCardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes owTopBar { to { background-position: 300% 0; } }

  .orientation-warning .ow-icon-wrap {
    position: relative;
    width: 110px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 4px;
    z-index: 1;
  }
  .orientation-warning .ow-icon-wrap::before,
  .orientation-warning .ow-icon-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px dashed rgba(255,107,157,0.45);
    animation: owRingSpin 12s linear infinite;
  }
  .orientation-warning .ow-icon-wrap::after {
    inset: 10px;
    border-color: rgba(167,139,250,0.5);
    animation-direction: reverse;
    animation-duration: 16s;
  }
  @keyframes owRingSpin { to { transform: rotate(360deg); } }

  .orientation-warning .ow-icon-inner {
    position: relative;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #FFF4D6 40%, #FFD3E0 75%, #FFB6D5 100%);
    box-shadow:
      0 0 0 4px rgba(255,255,255,0.95),
      0 10px 28px rgba(255,107,157,0.4),
      inset 0 -6px 12px rgba(232,74,127,0.15),
      inset 0 4px 8px rgba(255,255,255,0.9);
    animation: owIconTilt 3s ease-in-out infinite;
    z-index: 2;
  }
  @keyframes owIconTilt {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(82deg); }
  }

  .orientation-warning .ow-spark {
    position: absolute;
    font-size: 0.85rem;
    pointer-events: none;
    filter: drop-shadow(0 0 8px rgba(245,197,66,0.8));
    animation: owSparkle 2.4s ease-in-out infinite;
    z-index: 3;
  }
  .orientation-warning .ow-spark:nth-child(1) { top: -2px; left: 50%; transform: translateX(-50%); animation-delay: 0s; }
  .orientation-warning .ow-spark:nth-child(2) { bottom: 6px; left: 4px; animation-delay: 0.6s; }
  .orientation-warning .ow-spark:nth-child(3) { bottom: 6px; right: 4px; animation-delay: 1.2s; }
  .orientation-warning .ow-spark:nth-child(4) { top: 30%; right: -2px; animation-delay: 1.8s; }
  @keyframes owSparkle {
    0%, 100% { opacity: 0.3; transform: scale(0.7) rotate(0deg); }
    50%      { opacity: 1;   transform: scale(1.2) rotate(180deg); }
  }

  .orientation-warning .ow-title {
    font-family: 'Baloo 2', cursive;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -0.3px;
    background: linear-gradient(135deg, var(--rose) 0%, var(--orange) 55%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 3px rgba(255,107,157,0.2));
    line-height: 1.2;
    z-index: 1;
  }

  .orientation-warning .ow-text {
    font-size: 0.92rem;
    color: var(--text-soft);
    font-weight: 600;
    line-height: 1.55;
    z-index: 1;
    padding: 0 4px;
  }
  .orientation-warning .ow-text strong {
    color: var(--rose);
    font-weight: 800;
  }

  .orientation-warning .ow-tips {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,244,214,0.7);
    border: 1.5px solid rgba(245,197,66,0.5);
    border-radius: 14px;
    padding: 8px 14px;
    font-size: 0.76rem;
    font-weight: 700;
    color: #7A5500;
    z-index: 1;
    box-shadow: 0 2px 0 rgba(245,197,66,0.35);
  }
  .orientation-warning .ow-tips .ow-tip-icon {
    display: inline-block;
    animation: owSpinSlow 4s linear infinite;
  }
  @keyframes owSpinSlow { to { transform: rotate(360deg); } }

  .orientation-warning .ow-btn {
    position: relative;
    background: linear-gradient(135deg, var(--rose) 0%, var(--orange) 100%);
    color: #fff;
    border: none;
    padding: 14px 40px;
    border-radius: 50px;
    font-family: 'Baloo 2', cursive;
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 0.4px;
    cursor: pointer;
    overflow: hidden;
    box-shadow:
      0 6px 0 var(--rose-deep),
      0 18px 36px rgba(255,107,157,0.45),
      inset 0 -2px 0 rgba(0,0,0,0.08),
      inset 0 1.5px 0 rgba(255,255,255,0.35);
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-shadow: 0 2px 3px rgba(0,0,0,0.18);
    z-index: 1;
    margin-top: 2px;
    min-width: 200px;
    touch-action: manipulation;
  }
  .orientation-warning .ow-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -120%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    transition: 0.6s;
  }
  .orientation-warning .ow-btn:hover::before { left: 120%; }
  .orientation-warning .ow-btn:hover {
    transform: translateY(-3px);
    box-shadow:
      0 9px 0 var(--rose-deep),
      0 24px 44px rgba(255,107,157,0.55),
      inset 0 -2px 0 rgba(0,0,0,0.08),
      inset 0 1.5px 0 rgba(255,255,255,0.35);
  }
  .orientation-warning .ow-btn:active {
    transform: translateY(3px);
    box-shadow:
      0 2px 0 var(--rose-deep),
      0 8px 18px rgba(255,107,157,0.35);
  }

  @media (orientation: portrait) and (max-width: 900px) {
    .orientation-warning:not(.hidden) { display: flex; }
  }

  @media (max-width: 400px) {
    .orientation-warning .ow-content { padding: 28px 20px 24px; border-radius: 26px; }
    .orientation-warning .ow-title { font-size: 1.2rem; }
    .orientation-warning .ow-text { font-size: 0.86rem; }
    .orientation-warning .ow-icon-wrap { width: 92px; height: 92px; }
    .orientation-warning .ow-icon-inner { width: 66px; height: 66px; font-size: 2rem; }
    .orientation-warning .ow-btn { padding: 12px 32px; font-size: 0.92rem; min-width: 180px; }
  }

  /* Landscape HP: compact warning */
  @media (orientation: landscape) and (max-height: 500px) {
    .orientation-warning { padding: 12px; }
    .orientation-warning .ow-content {
      flex-direction: row;
      gap: 20px;
      padding: 20px 24px;
      max-width: 640px;
      border-radius: 24px;
      align-items: center;
    }
    .orientation-warning .ow-content::before { border-radius: 24px 24px 0 0; }
    .orientation-warning .ow-icon-wrap { width: 80px; height: 80px; flex-shrink: 0; margin-top: 0; }
    .orientation-warning .ow-icon-inner { width: 58px; height: 58px; font-size: 1.8rem; }
    .orientation-warning .ow-title { font-size: 1.1rem; text-align: left; }
    .orientation-warning .ow-text { font-size: 0.82rem; text-align: left; }
    .orientation-warning .ow-tips { font-size: 0.7rem; padding: 6px 10px; }
    .orientation-warning .ow-btn { padding: 10px 24px; font-size: 0.85rem; min-width: 150px; }
    .orientation-warning .ow-info { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; flex: 1; }
  }

  /* ===== FLOATING DECOR ===== */
  .float-deco {
    position: fixed;
    font-size: clamp(1rem, 2.5vw, 1.6rem);
    pointer-events: none;
    z-index: 1;
    opacity: 0.7;
    filter: drop-shadow(0 6px 12px rgba(255,107,157,0.25));
  }
  .float-deco.d1 { top: 12%; left: 5%; animation: floaty 8s ease-in-out infinite; }
  .float-deco.d2 { top: 25%; right: 8%; animation: floaty 10s ease-in-out infinite 1s; }
  .float-deco.d3 { bottom: 18%; left: 8%; animation: floaty 9s ease-in-out infinite 2s; }
  .float-deco.d4 { bottom: 25%; right: 5%; animation: floaty 11s ease-in-out infinite 3s; }
  .float-deco.d5 { top: 55%; left: 3%; animation: floaty 12s ease-in-out infinite 1.5s; }
  .float-deco.d6 { top: 65%; right: 4%; animation: floaty 10s ease-in-out infinite 2.5s; }
  @keyframes floaty {
    0%,100% { transform: translate(0,0) rotate(-5deg); }
    25% { transform: translate(15px,-20px) rotate(8deg); }
    50% { transform: translate(-10px,15px) rotate(-6deg); }
    75% { transform: translate(20px,10px) rotate(4deg); }
  }

  /* ===== TOPBAR ===== */
  .topbar {
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    padding: max(10px, env(safe-area-inset-top)) 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 24px rgba(255,107,157,0.08);
    border-bottom: 1.5px solid rgba(255,255,255,0.9);
    position: sticky; top: 0; z-index: 50;
    gap: 10px;
    min-height: 60px;
  }
  .topbar-title {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(0.9rem, 3vw, 1.15rem);
    background: linear-gradient(135deg, var(--rose), var(--orange), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    flex: 1;
    text-align: center;
    letter-spacing: -0.3px;
    filter: drop-shadow(0 2px 4px rgba(255,107,157,0.15));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .btn-icon {
    background: rgba(255,255,255,0.9);
    border: 2px solid rgba(255,255,255,0.95);
    color: var(--rose);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-weight: 700;
    font-family: 'Quicksand', sans-serif;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 4px 0 rgba(255,107,157,0.15),
      0 8px 20px rgba(255,107,157,0.2),
      inset 0 1px 0 rgba(255,255,255,1);
    flex-shrink: 0;
    touch-action: manipulation;
  }
  .btn-icon:hover {
    background: rgba(255,255,255,1);
    transform: translateY(-3px) scale(1.05);
    box-shadow:
      0 7px 0 rgba(255,107,157,0.2),
      0 12px 26px rgba(255,107,157,0.3),
      inset 0 1px 0 rgba(255,255,255,1);
  }
  .btn-icon:active {
    transform: translateY(1px);
    box-shadow: 0 2px 0 rgba(255,107,157,0.2);
  }

  .star-pill {
    background: linear-gradient(135deg, #FFF8D6, var(--gold));
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 800;
    font-family: 'Baloo 2', cursive;
    color: #7A5500;
    font-size: 0.9rem;
    box-shadow:
      0 4px 0 rgba(245,197,66,0.6),
      0 8px 20px rgba(245,197,66,0.35),
      inset 0 1px 0 rgba(255,255,255,0.8);
    white-space: nowrap;
    border: 2px solid rgba(255,255,255,0.95);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }

  /* ===== SCREENS ===== */
  .screen {
    flex: 1;
    padding: 22px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
  .screen-enter { animation: screenEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes screenEnter {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== HOME ===== */
  .mascot {
    font-size: clamp(3.2rem, 14vw, 5rem);
    display: inline-block;
    animation: mascotBob 2.5s ease-in-out infinite;
    filter: drop-shadow(0 10px 22px rgba(255,107,157,0.45));
    line-height: 1;
  }
  @keyframes mascotBob {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-12px) rotate(5deg); }
  }
  .home-hero { text-align: center; margin-bottom: 22px; }
  .home-hero h1 {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1.6rem, 6vw, 2.6rem);
    color: #fff;
    text-shadow:
      3px 3px 0 var(--rose),
      5px 5px 0 var(--gold),
      7px 7px 24px rgba(255,107,157,0.4);
    margin: 10px 0 8px;
    letter-spacing: -0.8px;
    animation: titleGlow 3s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .home-hero p {
    color: var(--text-soft);
    font-size: clamp(0.88rem, 2.7vw, 1.05rem);
    font-weight: 600;
    max-width: 400px;
    margin: 0 auto;
    line-height: 1.55;
  }

  .section-label {
    width: 100%;
    text-align: left;
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    color: var(--text);
    font-size: 0.85rem;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin: 8px 4px 10px;
    opacity: 0.85;
  }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 155px), 1fr));
    gap: 14px;
    width: 100%;
    margin-top: 4px;
  }
  .level-card {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 20px 12px 16px;
    text-align: center;
    cursor: pointer;
    box-shadow:
      0 10px 0 rgba(0,0,0,0.04),
      0 20px 45px rgba(255,107,157,0.12),
      inset 0 1px 0 rgba(255,255,255,1);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    border: 2px solid rgba(255,255,255,0.95);
    overflow: hidden;
    animation: cardAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  .level-card:nth-child(1) { animation-delay: 0.05s; }
  .level-card:nth-child(2) { animation-delay: 0.1s; }
  .level-card:nth-child(3) { animation-delay: 0.15s; }
  .level-card:nth-child(4) { animation-delay: 0.2s; }
  .level-card:nth-child(5) { animation-delay: 0.25s; }
  .level-card:nth-child(6) { animation-delay: 0.3s; }
  .level-card:nth-child(7) { animation-delay: 0.35s; }
  .level-card:nth-child(8) { animation-delay: 0.4s; }
  @keyframes cardAppear {
    from { opacity: 0; transform: translateY(30px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .level-card::before {
    content: '';
    position: absolute;
    top: -50%; right: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 60%);
    opacity: 0;
    transition: 0.6s;
    pointer-events: none;
  }
  .level-card:hover::before { opacity: 1; }
  .level-card:hover {
    transform: translateY(-10px) rotate(-1deg) scale(1.02);
    box-shadow:
      0 18px 0 rgba(0,0,0,0.05),
      0 30px 60px rgba(255,107,157,0.2),
      inset 0 1px 0 rgba(255,255,255,1);
  }
  .level-card:active { transform: translateY(-2px) scale(1); }
  .level-card.locked {
    opacity: 0.55;
    filter: grayscale(0.4);
    cursor: not-allowed;
  }
  .level-card.locked:hover {
    transform: translateY(-2px);
    box-shadow:
      0 10px 0 rgba(0,0,0,0.04),
      0 20px 45px rgba(255,107,157,0.12),
      inset 0 1px 0 rgba(255,255,255,1);
  }

  .level-num {
    position: absolute;
    top: 10px; left: 10px;
    background: linear-gradient(135deg, #FFF8D6, var(--gold));
    color: #7A5500;
    font-size: 0.6rem;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 8px;
    letter-spacing: 0.8px;
    font-family: 'Baloo 2', cursive;
    box-shadow: 0 2px 0 rgba(245,197,66,0.6);
  }
  .level-emoji {
    font-size: clamp(2.2rem, 7.5vw, 2.9rem);
    display: block;
    margin: 12px 0 4px;
    filter: drop-shadow(0 8px 14px rgba(255,107,157,0.25));
    transition: transform 0.35s;
    line-height: 1;
  }
  .level-card:hover .level-emoji { transform: scale(1.15) rotate(8deg); }
  .level-name {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(0.95rem, 2.8vw, 1.08rem);
    color: var(--text);
    margin-bottom: 3px;
  }
  .level-desc {
    font-size: clamp(0.68rem, 2vw, 0.78rem);
    color: var(--text-muted);
    line-height: 1.35;
    min-height: 32px;
    font-weight: 600;
  }
  .level-stars {
    margin-top: 10px;
    font-size: 1.1rem;
    letter-spacing: 3px;
    font-family: 'Baloo 2', cursive;
    line-height: 1;
  }
  .level-stars .on {
    color: var(--gold-deep);
    text-shadow: 0 0 10px rgba(245,197,66,0.8);
    display: inline-block;
    animation: starPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  .level-stars .on:nth-child(1) { animation-delay: 0.1s; }
  .level-stars .on:nth-child(2) { animation-delay: 0.2s; }
  .level-stars .on:nth-child(3) { animation-delay: 0.3s; }
  @keyframes starPop {
    from { transform: scale(0) rotate(-180deg); }
    to { transform: scale(1) rotate(0); }
  }
  .level-stars .off { color: #E5E7EB; }

  .lock-badge {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2rem;
    opacity: 0.9;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.3));
    pointer-events: none;
  }

  /* ===== GAME ===== */
  .progress-wrap {
    width: 100%;
    max-width: 700px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-bar {
    flex: 1;
    height: 16px;
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      inset 0 2px 5px rgba(180,120,180,0.15),
      0 2px 0 rgba(255,255,255,0.6);
    position: relative;
    border: 2px solid #fff;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rose) 0%, var(--orange) 50%, var(--gold) 100%);
    border-radius: 20px;
    width: 0%;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 12px rgba(255,179,71,0.6);
    position: relative;
    overflow: hidden;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    animation: shimmer 2s infinite;
  }
  @keyframes shimmer {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }
  .score-pill {
    background: linear-gradient(135deg, #FFF8D6, var(--gold));
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 800;
    font-family: 'Baloo 2', cursive;
    color: #7A5500;
    font-size: 0.88rem;
    box-shadow:
      0 4px 0 rgba(245,197,66,0.6),
      0 8px 20px rgba(245,197,66,0.3),
      inset 0 1px 0 rgba(255,255,255,0.8);
    white-space: nowrap;
    border: 2px solid rgba(255,255,255,0.95);
    flex-shrink: 0;
  }

  .question-card {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-radius: 32px;
    padding: 26px 18px 24px;
    width: 100%;
    max-width: 700px;
    box-shadow:
      0 10px 0 rgba(255,107,157,0.12),
      0 24px 55px rgba(255,107,157,0.18),
      inset 0 1px 0 rgba(255,255,255,1);
    margin-bottom: 18px;
    text-align: center;
    border: 2px solid rgba(255,255,255,0.95);
    position: relative;
    overflow: hidden;
    animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.92) translateY(15px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: -60%; left: -60%;
    width: 220%; height: 220%;
    background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, transparent 55%);
    pointer-events: none;
  }

  .q-prompt {
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    color: var(--text);
    font-size: clamp(0.95rem, 2.8vw, 1.2rem);
    margin-bottom: 10px;
    line-height: 1.4;
    position: relative;
    z-index: 1;
  }
  .q-emoji {
    font-size: clamp(4rem, 20vw, 7.5rem);
    display: block;
    margin: 4px 0 22px;
    animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 14px 24px rgba(255,107,157,0.3));
    position: relative;
    z-index: 1;
    line-height: 1;
  }
  @keyframes popIn {
    0% { transform: scale(0.2) rotate(-25deg); opacity: 0; }
    70% { transform: scale(1.08) rotate(5deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr));
    gap: 12px;
    margin-top: 10px;
    position: relative;
    z-index: 1;
  }
  .option {
    background: linear-gradient(180deg, #FFFFFF 0%, rgba(232,244,255,0.9) 100%);
    border: 2px solid rgba(125,211,252,0.5);
    border-radius: 20px;
    padding: 18px 12px;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1.05rem, 3.5vw, 1.5rem);
    font-weight: 800;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 5px 0 rgba(125,211,252,0.5);
    user-select: none;
    position: relative;
    overflow: hidden;
    touch-action: manipulation;
    min-height: 60px;
  }
  .option:hover:not(.disabled) {
    transform: translateY(-4px);
    border-color: var(--orange);
    background: linear-gradient(180deg, #FFF8D6 0%, var(--gold) 100%);
    box-shadow: 0 9px 0 var(--orange);
    color: #7A5500;
  }
  .option:active:not(.disabled) {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(125,211,252,0.5);
  }
  .option.correct {
    background: linear-gradient(180deg, #D1FAE5 0%, #A7F3D0 100%);
    border-color: #10B981;
    box-shadow: 0 5px 0 #10B981;
    color: #065F46;
    animation: correctPulse 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .option.wrong {
    background: linear-gradient(180deg, #FEE2E2 0%, #FECACA 100%);
    border-color: #EF4444;
    box-shadow: 0 5px 0 #EF4444;
    color: #991B1B;
    animation: shake 0.5s;
  }
  .option.disabled { cursor: not-allowed; }
  @keyframes correctPulse {
    0%,100% { transform: scale(1); }
    40% { transform: scale(1.1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  /* ===== BACA & TEBAK ===== */
  .read-word {
    background: linear-gradient(135deg, #FFF8D6 0%, var(--bg-1) 100%);
    border-radius: 24px;
    padding: 24px 20px;
    margin-bottom: 20px;
    border: 2px dashed var(--orange);
    position: relative;
    z-index: 1;
  }
  .read-word .label {
    font-family: 'Baloo 2', cursive;
    font-size: 0.85rem;
    color: var(--text-soft);
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.8;
  }
  .read-word .word {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(2rem, 9vw, 3.5rem);
    font-weight: 800;
    color: var(--rose);
    letter-spacing: 4px;
    text-shadow:
      3px 3px 0 #FFF8D6,
      5px 5px 18px rgba(255,107,157,0.4);
    animation: wordPulse 2s ease-in-out infinite;
    line-height: 1.1;
  }
  @keyframes wordPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  .read-word .sentence {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1.15rem, 4vw, 1.6rem);
    font-weight: 700;
    color: var(--text);
    line-height: 1.5;
    letter-spacing: 0.5px;
  }
  .read-word .sentence .highlight {
    background: linear-gradient(180deg, transparent 60%, var(--gold) 60%);
    padding: 0 4px;
    border-radius: 4px;
  }

  .image-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 10px;
    position: relative;
    z-index: 1;
  }
  .image-option {
    background: linear-gradient(180deg, #FFFFFF 0%, rgba(232,244,255,0.9) 100%);
    border: 2px solid rgba(125,211,252,0.5);
    border-radius: 20px;
    padding: 16px 8px;
    font-size: clamp(2.5rem, 9vw, 4rem);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 5px 0 rgba(125,211,252,0.5);
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1/1;
    touch-action: manipulation;
  }
  .image-option:hover:not(.disabled) {
    transform: translateY(-4px) scale(1.03);
    border-color: var(--orange);
    background: linear-gradient(180deg, #FFF8D6 0%, var(--gold) 100%);
    box-shadow: 0 9px 0 var(--orange);
  }
  .image-option:active:not(.disabled) {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(125,211,252,0.5);
  }
  .image-option.correct {
    background: linear-gradient(180deg, #D1FAE5 0%, #A7F3D0 100%);
    border-color: #10B981;
    box-shadow: 0 5px 0 #10B981;
    animation: correctPulse 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .image-option.wrong {
    background: linear-gradient(180deg, #FEE2E2 0%, #FECACA 100%);
    border-color: #EF4444;
    box-shadow: 0 5px 0 #EF4444;
    animation: shake 0.5s;
  }

  /* ===== SUSUN KALIMAT ===== */
  .sentence-area {
    min-height: 82px;
    background: linear-gradient(135deg, #FFF8D6 0%, var(--gold) 100%);
    border: 2px dashed var(--orange);
    border-radius: 22px;
    padding: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-bottom: 18px;
    transition: all 0.3s;
    position: relative;
  }
  .sentence-area:empty::before {
    content: '👇 Susun kata di sini...';
    color: #7A5500;
    font-size: 0.9rem;
    opacity: 0.7;
    font-weight: 700;
    font-family: 'Baloo 2', cursive;
  }
  .word-chip {
    background: #fff;
    border: 2.5px solid var(--rose);
    color: var(--rose);
    padding: 9px 18px;
    border-radius: 16px;
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    user-select: none;
    box-shadow: 0 3px 0 var(--rose);
    touch-action: manipulation;
  }
  .word-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 10px;
    min-height: 50px;
  }
  .word-pool .word-chip {
    background: #fff;
    border-color: var(--sky);
    color: var(--sky-deep);
    box-shadow: 0 3px 0 var(--sky);
  }
  .word-pool .word-chip:hover {
    background: rgba(232,244,255,1);
    transform: translateY(-3px);
    box-shadow: 0 6px 0 var(--sky);
  }
  .word-pool .word-chip:active {
    transform: translateY(1px);
    box-shadow: 0 1px 0 var(--sky);
  }
  .word-pool .word-chip.used {
    opacity: 0.2;
    pointer-events: none;
    transform: scale(0.9);
  }
  .sentence-area .word-chip {
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    color: #fff;
    border-color: var(--rose-deep);
    box-shadow: 0 3px 0 #B83A66;
    animation: chipIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .sentence-area .word-chip:hover {
    background: linear-gradient(135deg, var(--rose-deep), #C93A6E);
    transform: translateY(-3px);
    box-shadow: 0 6px 0 #B83A66;
  }
  @keyframes chipIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* ===== STORY ===== */
  .story-box {
    background: linear-gradient(135deg, #FFF8D6 0%, var(--bg-1) 100%);
    border-radius: 22px;
    padding: 20px 22px;
    margin-bottom: 16px;
    text-align: left;
    font-size: clamp(1rem, 2.9vw, 1.15rem);
    line-height: 1.75;
    color: var(--text);
    font-weight: 600;
    border: 2px solid var(--orange);

          setTimeout(() => loader.remove(), 700);
        }
      }, 2200);

    type = type || 'sine';
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.1, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }

  // ===== STATE =====
  const state = {
    screen: 'home',
    level: 0,
    question: 0,
    score: 0,
    correctCount: 0,
    stars: JSON.parse(localStorage.getItem('membaca_stars_v3') || '{}'),
    arranged: [],
    pool: [],
    answered: false,
    checking: false,
    lastStars: 0,
    lastCorrect: 0,
    lastTotal: 0
  };

  // ===== HELPERS =====
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function saveStars() {
    try { localStorage.setItem('membaca_stars_v3', JSON.stringify(state.stars)); } catch(e) {}
  }
  function isLevelUnlocked(idx) {
    if (idx === 0) return true;
    return (state.stars[idx - 1] || 0) >= 1;
  }
  function totalStars() {
    let t = 0;
    levels.forEach((_, i) => { t += (state.stars[i] || 0); });
    return t;
  }
  function maxStars() { return levels.length * 3; }

  function spawnConfetti() {
    const emojis = ['🎉','⭐','✨','🌟','💖','🎊','🌈','💫','🌸'];
    for (let i = 0; i < 25; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = (2.5 + Math.random() * 2) + 's';
      el.style.animationDelay = (Math.random() * 0.8) + 's';
      el.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }
  }

  // ===== RENDER =====
  function render() {
    const app = document.getElementById('app');
    if (state.screen === 'home') renderHome(app);
    else if (state.screen === 'game') renderGame(app);
    else if (state.screen === 'complete') renderComplete(app);
  }

  function renderHome(app) {
    const tStars = totalStars();
    const mStars = maxStars();

    app.innerHTML = `
      <div class="topbar">
        <div style="width:42px"></div>
        <div class="topbar-title">📖 Petualangan Membaca</div>
        <div class="star-pill">⭐ ${tStars}/${mStars}</div>
      </div>
      <div class="screen screen-enter">
        <div class="home-hero">
          <span class="mascot">📚</span>
          <h1>Petualangan Membaca</h1>
          <p>Kelas 1 SD • 8 permainan seru untuk belajar membaca! 🌈</p>
        </div>
        <div class="section-label">🎯 Pilih Permainanmu (8 Game)</div>
        <div class="level-grid">
          ${levels.map((lv, i) => {
            const s = state.stars[i] || 0;
            const unlocked = isLevelUnlocked(i);
            const starsHtml = [0,1,2].map(k =>
              `<span class="${k < s ? 'on' : 'off'}">★</span>`
            ).join('');
            return `
              <div class="level-card ${unlocked ? '' : 'locked'}" data-level="${i}">
                <div class="level-num">GAME ${i+1}</div>
                <span class="level-emoji">${lv.icon}</span>
                <div class="level-name">${lv.name}</div>
                <div class="level-desc">${unlocked ? lv.desc : '🔒 Selesaikan game sebelumnya'}</div>
                <div class="level-stars">${starsHtml}</div>
                ${unlocked ? '' : '<span class="lock-badge">🔒</span>'}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;

    app.querySelectorAll('.level-card').forEach(card => {
      card.addEventListener('click', () => {
        const idx = parseInt(card.dataset.level);
        if (!isLevelUnlocked(idx)) {
          S.wrong();
          card.style.animation = 'shake 0.5s';
          setTimeout(() => card.style.animation = '', 500);
          return;
        }
        S.click();
        startLevel(idx);
      });
    });
  }

  function startLevel(levelIdx) {
    state.level = levelIdx;
    state.question = 0;
    state.score = 0;
    state.correctCount = 0;
    state.arranged = [];
    state.pool = [];
    state.answered = false;
    state.checking = false;
    state.screen = 'game';
    render();
  }

  function renderGame(app) {
    const lv = levels[state.level];
    const q = lv.questions[state.question];
    const total = lv.questions.length;
    const progress = (state.question / total) * 100;

    if (q.type === 'arrange' && state.pool.length === 0) {
      state.pool = shuffle(q.words.map((w, i) => ({ text: w, idx: i })));
    }

    let questionHtml = '';

    if (q.type === 'choice') {
      questionHtml = `
        <div class="question-card">
          <div class="q-prompt">${q.prompt}</div>
          <span class="q-emoji">${q.emoji}</span>
          <div class="options">
            ${q.options.map((opt, i) =>
              `<button class="option" data-opt="${i}">${opt}</button>`
            ).join('')}
          </div>
        </div>
      `;
    } else if (q.type === 'arrange') {
      questionHtml = `
        <div class="question-card">
          <div class="q-prompt">${q.prompt}</div>
          <div class="sentence-area" id="sentenceArea">
            ${state.arranged.map((origIdx, pos) =>
              `<span class="word-chip" data-pos="${pos}">${q.words[origIdx]}</span>`
            ).join('')}
          </div>
          <div class="word-pool" id="wordPool">
            ${state.pool.map(p => {
              const used = state.arranged.includes(p.idx);
              return `<span class="word-chip ${used ? 'used' : ''}" data-idx="${p.idx}">${p.text}</span>`;
            }).join('')}
          </div>
        </div>
      `;
    } else if (q.type === 'story') {
      questionHtml = `
        <div class="question-card">
          <div class="story-box">${q.story}</div>
          <div class="q-prompt">${q.prompt}</div>
          <div class="options">
            ${q.options.map((opt, i) =>
              `<button class="option" data-opt="${i}">${opt}</button>`
            ).join('')}
          </div>
        </div>
      `;
    } else if (q.type === 'readImage') {
      questionHtml = `
        <div class="question-card">
          <div class="q-prompt">${q.prompt}</div>
          <div class="read-word">
            <div class="label">📖 Baca kata berikut</div>
            <div class="word">${q.word}</div>
          </div>
          <div class="image-options">
            ${q.options.map((opt, i) =>
              `<button class="image-option" data-opt="${i}" title="${opt.t}">${opt.e}</button>`
            ).join('')}
          </div>
        </div>
      `;
    }

    app.innerHTML = `
      <div class="topbar">
        <button class="btn-icon" id="btnHome" title="Menu">🏠</button>
        <div class="topbar-title">${lv.icon} ${lv.name}</div>
        <div class="star-pill">⭐ ${state.score}</div>
      </div>
      <div class="screen screen-enter">
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
          <div class="score-pill">⭐ ${state.score}</div>
        </div>
        ${questionHtml}
        <div class="feedback" id="feedback">
          <div class="feedback-box">
            <span class="feedback-emoji" id="fbEmoji">🎉</span>
            <div class="feedback-text" id="fbText">Hebat!</div>
            <div class="feedback-sub" id="fbSub"></div>
            <button class="btn-next" id="btnNext">Lanjut ➜</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('btnHome').addEventListener('click', () => {
      S.click();
      state.screen = 'home';
      render();
    });

    if (q.type === 'choice' || q.type === 'story') {
      app.querySelectorAll('.option').forEach(btn => {
        btn.addEventListener('click', () => {
          if (state.answered) return;
          handleChoice(parseInt(btn.dataset.opt), q.answer, btn);
        });
      });
    } else if (q.type === 'readImage') {
      app.querySelectorAll('.image-option').forEach(btn => {
        btn.addEventListener('click', () => {
          if (state.answered) return;
          handleChoice(parseInt(btn.dataset.opt), q.answer, btn);
        });
      });
    } else if (q.type === 'arrange') {
      app.querySelectorAll('#wordPool .word-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          if (state.answered || state.checking) return;
          const idx = parseInt(chip.dataset.idx);
          if (state.arranged.includes(idx)) return;
          S.click();
          state.arranged.push(idx);
          render();
        });
      });
      app.querySelectorAll('#sentenceArea .word-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          if (state.answered || state.checking) return;
          S.click();
          const pos = parseInt(chip.dataset.pos);
          state.arranged.splice(pos, 1);
          render();
        });
      });

      if (state.arranged.length === q.words.length && !state.answered && !state.checking) {
        state.checking = true;
        setTimeout(() => {
          state.checking = false;
          checkArrange(q);
        }, 300);
      }
    }

    document.getElementById('btnNext').addEventListener('click', () => {
      S.click();
      hideFeedback();
      nextQuestion();
    });
  }

  function handleChoice(selected, answer, btn) {
    state.answered = true;
    const correct = selected === answer;
    const isImage = btn.classList.contains('image-option');
    const allOpts = document.querySelectorAll(isImage ? '.image-option' : '.option');
    allOpts.forEach(o => o.classList.add('disabled'));

    if (correct) {
      S.correct();
      btn.classList.add('correct');
      state.score += 10;
      state.correctCount++;
      showFeedback(true);
    } else {
      S.wrong();
      btn.classList.add('wrong');
      allOpts[answer].classList.add('correct');
      showFeedback(false);
    }
  }

  function checkArrange(q) {
    if (state.answered) return;
    state.answered = true;
    const userSentence = state.arranged.map(i => q.words[i]);
    const correct = JSON.stringify(userSentence) === JSON.stringify(q.words);
    if (correct) {
      S.correct();
      state.score += 10;
      state.correctCount++;
      showFeedback(true);
    } else {
      S.wrong();
      showFeedback(false);
    }
  }

  function showFeedback(correct) {
    const fb = document.getElementById('feedback');
    const emoji = document.getElementById('fbEmoji');
    const text = document.getElementById('fbText');
    const sub = document.getElementById('fbSub');
    const isLast = state.question >= levels[state.level].questions.length - 1;

    if (correct) {
      const emojis = ['🎉','🌟','👏','💫','🏆','🎊','🌸'];
      const texts = ['Hebat!','Pintar!','Bagus sekali!','Keren!','Mantap!','Luar biasa!'];
      const i = Math.floor(Math.random() * emojis.length);
      emoji.textContent = emojis[i];
      text.textContent = texts[i];
      text.style.color = '#10B981';
      sub.textContent = '+10 poin ⭐';
      spawnConfetti();
    } else {
      emoji.textContent = '😅';
      text.textContent = 'Belum tepat!';
      text.style.color = '#EF4444';
      sub.textContent = 'Ayo coba lagi ya!';
    }

    document.getElementById('btnNext').textContent = isLast ? 'Selesai 🏁' : 'Lanjut ➜';
    fb.classList.add('show');
  }

  function hideFeedback() {
    const fb = document.getElementById('feedback');
    if (fb) fb.classList.remove('show');
  }

  function nextQuestion() {
    const lv = levels[state.level];
    if (state.question >= lv.questions.length - 1) {
      const totalQ = lv.questions.length;
      const percent = state.correctCount / totalQ;
      let stars = 1;
      if (percent >= 0.6) stars = 2;
      if (percent >= 0.85) stars = 3;

      const prev = state.stars[state.level] || 0;
      if (stars > prev) state.stars[state.level] = stars;
      saveStars();

      state.lastStars = stars;
      state.lastCorrect = state.correctCount;
      state.lastTotal = totalQ;
      state.screen = 'complete';
      S.win();
      setTimeout(spawnConfetti, 200);
      setTimeout(spawnConfetti, 800);
      render();
      return;
    }
    state.question++;
    state.answered = false;
    state.checking = false;
    state.arranged = [];
    state.pool = [];
    render();
  }

  function renderComplete(app) {
    const lv = levels[state.level];
    const stars = state.lastStars;
    const starsHtml = [0,1,2].map(i =>
      `<span class="${i < stars ? 'on' : 'off'}">★</span>`
    ).join('');
    const isLastLevel = state.level >= levels.length - 1;

    let subtitle;
    if (stars === 3) subtitle = 'Sempurna! Kamu luar biasa! 🌟';
    else if (stars === 2) subtitle = 'Bagus sekali! Sedikit lagi sempurna! 💪';
    else subtitle = 'Kerja bagus! Coba lagi untuk bintang lebih banyak! ✨';

    app.innerHTML = `
      <div class="topbar">
        <button class="btn-icon" id="btnHome">🏠</button>
        <div class="topbar-title">${lv.icon} ${lv.name}</div>
        <div style="width:42px"></div>
      </div>
      <div class="screen screen-enter">
        <div class="complete-card">
          <span class="complete-trophy">🏆</span>
          <div class="complete-title">Level Selesai!</div>
          <div class="complete-sub">
            Kamu menjawab <b>${state.lastCorrect}</b> dari <b>${state.lastTotal}</b> soal dengan benar<br>
            ${subtitle}
          </div>
          <div class="big-stars">${starsHtml}</div>
          <div class="complete-btns">
            <button class="btn-secondary" id="btnRetry">🔄 Ulangi</button>
            ${isLastLevel
              ? '<button class="btn-primary" id="btnHome2">🏠 Menu Utama</button>'
              : '<button class="btn-primary" id="btnNextLevel">Level Berikutnya ➜</button>'}
          </div>
        </div>
      </div>
    `;

    document.getElementById('btnHome').addEventListener('click', () => {
      S.click(); state.screen = 'home'; render();
    });
    document.getElementById('btnRetry').addEventListener('click', () => {
      S.click(); startLevel(state.level);
    });
    const nextBtn = document.getElementById('btnNextLevel');
    if (nextBtn) nextBtn.addEventListener('click', () => {
      S.click(); startLevel(state.level + 1);
    });
    const homeBtn2 = document.getElementById('btnHome2');
    if (homeBtn2) homeBtn2.addEventListener('click', () => {
      S.click(); state.screen = 'home'; render();
    });
  }
