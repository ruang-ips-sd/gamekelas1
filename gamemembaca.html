<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFD3E0">
<title>📖 Petualangan Membaca - Kelas 1 Ceria</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ====== PREMIUM COLOR SYSTEM (sama dengan landing page) ====== */
  :root {
    --bg-1: #FFD3E0;
    --bg-2: #FFE8CC;
    --bg-3: #FFF4D6;
    --bg-4: #E8F4FF;
    --bg-5: #D6F0FF;

    --rose: #FF6B9D;
    --rose-deep: #E84A7F;
    --orange: #FFB347;
    --orange-deep: #E8952E;
    --sky: #7DD3FC;
    --sky-deep: #38BDF8;
    --gold: #F5C542;
    --gold-deep: #D4A017;
    --mint: #5EC4C4;
    --mint-deep: #3AA8A8;

    --text: #3D3D5C;
    --text-soft: #6B6B8A;
    --text-muted: #9191A8;

    --shadow-rose: 0 8px 24px rgba(255,107,157,0.25);
    --shadow-orange: 0 8px 24px rgba(255,179,71,0.25);
    --shadow-sky: 0 8px 24px rgba(125,211,252,0.25);
    --shadow-gold: 0 8px 24px rgba(245,197,66,0.3);

    --glass: rgba(255,255,255,0.7);
    --glass-border: rgba(255,255,255,0.9);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Quicksand', 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg,
      var(--bg-1) 0%,
      var(--bg-2) 15%,
      var(--bg-3) 35%,
      var(--bg-4) 60%,
      var(--bg-5) 80%,
      #FFF2D9 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: var(--text);
    overflow-x: hidden;
    position: relative;
    font-weight: 600;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,255,255,0.5) 0%, transparent 30%),
      radial-gradient(circle at 90% 70%, rgba(255,255,255,0.35) 0%, transparent 35%);
    pointer-events: none;
    z-index: 1;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 2; }

  h1, h2, h3, h4 {
    font-family: 'Baloo 2', cursive;
    letter-spacing: -0.3px;
  }

  /* ===== LOADING SCREEN ===== */
  .loading-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg,
      var(--bg-1) 0%,
      var(--bg-2) 20%,
      var(--bg-3) 40%,
      var(--bg-4) 65%,
      var(--bg-5) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.6s ease, visibility 0.6s ease;
    overflow: hidden;
  }
  .loading-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .loading-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.5) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.4) 0%, transparent 40%);
    pointer-events: none;
  }

  .load-float {
    position: absolute;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    opacity: 0.75;
    pointer-events: none;
    filter: drop-shadow(0 6px 12px rgba(255,107,157,0.3));
  }
  .load-float.f1 { top: 10%; left: 10%; animation: floaty 6s ease-in-out infinite; }
  .load-float.f2 { top: 20%; right: 15%; animation: floaty 8s ease-in-out infinite 0.5s; }
  .load-float.f3 { bottom: 15%; left: 15%; animation: floaty 7s ease-in-out infinite 1s; }
  .load-float.f4 { bottom: 25%; right: 12%; animation: floaty 9s ease-in-out infinite 1.5s; }
  .load-float.f5 { top: 45%; left: 5%; animation: floaty 8s ease-in-out infinite 2s; }
  .load-float.f6 { top: 55%; right: 6%; animation: floaty 10s ease-in-out infinite 0.8s; }

  .load-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 20px;
  }

  .load-mascot-wrap {
    display: inline-block;
    position: relative;
    margin-bottom: 8px;
  }
  .load-mascot {
    font-size: clamp(4.5rem, 18vw, 6.5rem);
    display: inline-block;
    animation: flowerSpin 2.5s ease-in-out infinite;
    filter: drop-shadow(0 12px 25px rgba(255,107,157,0.5));
    margin-bottom: 12px;
  }
  @keyframes flowerSpin {
    0%,100% { transform: rotate(-12deg) scale(1); }
    50% { transform: rotate(12deg) scale(1.1); }
  }

  .load-title {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    color: #fff;
    text-shadow:
      3px 3px 0 var(--rose),
      5px 5px 0 var(--gold),
      7px 7px 24px rgba(255,107,157,0.4);
    margin-bottom: 6px;
    animation: titleGlow 2s ease-in-out infinite;
    letter-spacing: -0.5px;
  }
  @keyframes titleGlow {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .load-subtitle {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    color: var(--text-soft);
    font-size: clamp(0.85rem, 2.6vw, 1rem);
    margin-bottom: 28px;
    opacity: 0.9;
  }

  .load-bar-wrap {
    width: min(280px, 80vw);
    height: 20px;
    background: rgba(255,255,255,0.85);
    border-radius: 20px;
    border: 3px solid #fff;
    overflow: hidden;
    box-shadow:
      0 6px 0 rgba(255,107,157,0.15),
      0 12px 30px rgba(255,107,157,0.25),
      inset 0 2px 5px rgba(180,120,180,0.1);
    position: relative;
    margin-bottom: 16px;
    margin-left: auto;
    margin-right: auto;
  }
  .load-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rose) 0%, var(--orange) 50%, var(--gold) 100%);
    border-radius: 20px;
    width: 0%;
    transition: width 0.3s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 15px rgba(255,179,71,0.6);
  }
  .load-bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
    animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }

  .load-text {
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    color: var(--rose);
    font-size: clamp(0.9rem, 2.8vw, 1.05rem);
    letter-spacing: 0.5px;
    min-height: 1.3em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .load-text .dots span {
    display: inline-block;
    animation: dotBounce 1.2s infinite;
  }
  .load-text .dots span:nth-child(1) { animation-delay: 0s; }
  .load-text .dots span:nth-child(2) { animation-delay: 0.2s; }
  .load-text .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotBounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .load-ring {
    position: absolute;
    top: 50%; left: 50%;
    width: clamp(180px, 55vw, 260px);
    height: clamp(180px, 55vw, 260px);
    margin-left: calc(-1 * clamp(180px, 55vw, 260px) / 2);
    margin-top: calc(-1 * clamp(180px, 55vw, 260px) / 2 - 60px);
    border: 4px dashed rgba(255,107,157,0.35);
    border-radius: 50%;
    animation: ringSpin 8s linear infinite;
    pointer-events: none;
  }
  .load-ring::before {
    content: '';
    position: absolute;
    inset: 20px;
    border: 3px dotted rgba(245,197,66,0.4);
    border-radius: 50%;
    animation: ringSpin 6s linear infinite reverse;
  }
  @keyframes ringSpin { to { transform: rotate(360deg); } }

  .load-percent {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    color: var(--rose);
    font-size: clamp(1.1rem, 3.5vw, 1.4rem);
    margin-top: 8px;
    letter-spacing: 1px;
    min-height: 1.3em;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .load-percent.show { opacity: 1; }

  .load-sparkle {
    position: absolute;
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    animation: sparkleAnim 1.5s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(245,197,66,0.8));
  }
  .load-sparkle.s1 { top: -10px; left: -30px; animation-delay: 0s; }
  .load-sparkle.s2 { top: 10px; right: -35px; animation-delay: 0.5s; }
  .load-sparkle.s3 { bottom: -5px; left: -25px; animation-delay: 1s; }
  @keyframes sparkleAnim {
    0%,100% { opacity: 0.3; transform: scale(0.85) rotate(0); }
    50% { opacity: 1; transform: scale(1.2) rotate(20deg); }
  }

  /* ===== FLOATING DECOR ===== */
  .float-deco {
    position: fixed;
    font-size: clamp(1rem, 2.5vw, 1.6rem);
    pointer-events: none;
    z-index: 1;
    opacity: 0.7;
    filter: drop-shadow(0 6px 12px rgba(255,107,157,0.25));
  }
  .float-deco.d1 { top: 12%; left: 5%; animation: floaty 8s ease-in-out infinite; }
  .float-deco.d2 { top: 25%; right: 8%; animation: floaty 10s ease-in-out infinite 1s; }
  .float-deco.d3 { bottom: 18%; left: 8%; animation: floaty 9s ease-in-out infinite 2s; }
  .float-deco.d4 { bottom: 25%; right: 5%; animation: floaty 11s ease-in-out infinite 3s; }
  .float-deco.d5 { top: 55%; left: 3%; animation: floaty 12s ease-in-out infinite 1.5s; }
  .float-deco.d6 { top: 65%; right: 4%; animation: floaty 10s ease-in-out infinite 2.5s; }
  @keyframes floaty {
    0%,100% { transform: translate(0,0) rotate(-5deg); }
    25% { transform: translate(15px,-20px) rotate(8deg); }
    50% { transform: translate(-10px,15px) rotate(-6deg); }
    75% { transform: translate(20px,10px) rotate(4deg); }
  }

  /* ===== TOPBAR (glassmorphism premium) ===== */
  .topbar {
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 24px rgba(255,107,157,0.08);
    border-bottom: 1.5px solid rgba(255,255,255,0.9);
    position: sticky; top: 0; z-index: 50;
    gap: 10px;
    min-height: 60px;
  }
  .topbar-title {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    background: linear-gradient(135deg, var(--rose), var(--orange), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    flex: 1;
    text-align: center;
    letter-spacing: -0.3px;
    filter: drop-shadow(0 2px 4px rgba(255,107,157,0.15));
  }
  .btn-icon {
    background: rgba(255,255,255,0.9);
    border: 2px solid rgba(255,255,255,0.95);
    color: var(--rose);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-weight: 700;
    font-family: 'Quicksand', sans-serif;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 4px 0 rgba(255,107,157,0.15),
      0 8px 20px rgba(255,107,157,0.2),
      inset 0 1px 0 rgba(255,255,255,1);
    flex-shrink: 0;
  }
  .btn-icon:hover {
    background: rgba(255,255,255,1);
    transform: translateY(-3px) scale(1.05);
    box-shadow:
      0 7px 0 rgba(255,107,157,0.2),
      0 12px 26px rgba(255,107,157,0.3),
      inset 0 1px 0 rgba(255,255,255,1);
  }
  .btn-icon:active {
    transform: translateY(1px);
    box-shadow: 0 2px 0 rgba(255,107,157,0.2);
  }

  .star-pill {
    background: linear-gradient(135deg, #FFF8D6, var(--gold));
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 800;
    font-family: 'Baloo 2', cursive;
    color: #7A5500;
    font-size: 0.9rem;
    box-shadow:
      0 4px 0 rgba(245,197,66,0.6),
      0 8px 20px rgba(245,197,66,0.35),
      inset 0 1px 0 rgba(255,255,255,0.8);
    white-space: nowrap;
    border: 2px solid rgba(255,255,255,0.95);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  /* ===== SCREENS ===== */
  .screen {
    flex: 1;
    padding: 22px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
  .screen-enter { animation: screenEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes screenEnter {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== HOME ===== */
  .mascot {
    font-size: clamp(3.5rem, 14vw, 5rem);
    display: inline-block;
    animation: mascotBob 2.5s ease-in-out infinite;
    filter: drop-shadow(0 10px 22px rgba(255,107,157,0.45));
  }
  @keyframes mascotBob {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-12px) rotate(5deg); }
  }
  .home-hero { text-align: center; margin-bottom: 22px; }
  .home-hero h1 {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1.7rem, 5.5vw, 2.6rem);
    color: #fff;
    text-shadow:
      3px 3px 0 var(--rose),
      5px 5px 0 var(--gold),
      7px 7px 24px rgba(255,107,157,0.4);
    margin: 10px 0 8px;
    letter-spacing: -0.8px;
    animation: titleGlow 3s ease-in-out infinite;
  }
  .home-hero p {
    color: var(--text-soft);
    font-size: clamp(0.9rem, 2.7vw, 1.05rem);
    font-weight: 600;
    max-width: 400px;
    margin: 0 auto;
    line-height: 1.55;
  }

  .section-label {
    width: 100%;
    text-align: left;
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    color: var(--text);
    font-size: 0.85rem;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin: 8px 4px 10px;
    opacity: 0.85;
  }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
    gap: 14px;
    width: 100%;
    margin-top: 4px;
  }
  .level-card {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 20px 12px 16px;
    text-align: center;
    cursor: pointer;
    box-shadow:
      0 10px 0 rgba(0,0,0,0.04),
      0 20px 45px rgba(255,107,157,0.12),
      inset 0 1px 0 rgba(255,255,255,1);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    border: 2px solid rgba(255,255,255,0.95);
    overflow: hidden;
    animation: cardAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  .level-card:nth-child(1) { animation-delay: 0.05s; }
  .level-card:nth-child(2) { animation-delay: 0.1s; }
  .level-card:nth-child(3) { animation-delay: 0.15s; }
  .level-card:nth-child(4) { animation-delay: 0.2s; }
  .level-card:nth-child(5) { animation-delay: 0.25s; }
  .level-card:nth-child(6) { animation-delay: 0.3s; }
  .level-card:nth-child(7) { animation-delay: 0.35s; }
  .level-card:nth-child(8) { animation-delay: 0.4s; }
  @keyframes cardAppear {
    from { opacity: 0; transform: translateY(30px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .level-card::before {
    content: '';
    position: absolute;
    top: -50%; right: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 60%);
    opacity: 0;
    transition: 0.6s;
    pointer-events: none;
  }
  .level-card:hover::before { opacity: 1; }
  .level-card:hover {
    transform: translateY(-10px) rotate(-1deg) scale(1.02);
    box-shadow:
      0 18px 0 rgba(0,0,0,0.05),
      0 30px 60px rgba(255,107,157,0.2),
      inset 0 1px 0 rgba(255,255,255,1);
  }
  .level-card:active { transform: translateY(-2px) scale(1); }
  .level-card.locked {
    opacity: 0.55;
    filter: grayscale(0.4);
    cursor: not-allowed;
  }
  .level-card.locked:hover {
    transform: translateY(-2px);
    box-shadow:
      0 10px 0 rgba(0,0,0,0.04),
      0 20px 45px rgba(255,107,157,0.12),
      inset 0 1px 0 rgba(255,255,255,1);
  }

  .level-num {
    position: absolute;
    top: 10px; left: 10px;
    background: linear-gradient(135deg, #FFF8D6, var(--gold));
    color: #7A5500;
    font-size: 0.6rem;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 8px;
    letter-spacing: 0.8px;
    font-family: 'Baloo 2', cursive;
    box-shadow: 0 2px 0 rgba(245,197,66,0.6);
  }
  .level-emoji {
    font-size: clamp(2.2rem, 7.5vw, 2.9rem);
    display: block;
    margin: 12px 0 4px;
    filter: drop-shadow(0 8px 14px rgba(255,107,157,0.25));
    transition: transform 0.35s;
  }
  .level-card:hover .level-emoji { transform: scale(1.15) rotate(8deg); }
  .level-name {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(0.95rem, 2.8vw, 1.08rem);
    color: var(--text);
    margin-bottom: 3px;
  }
  .level-desc {
    font-size: clamp(0.68rem, 2vw, 0.78rem);
    color: var(--text-muted);
    line-height: 1.35;
    min-height: 32px;
    font-weight: 600;
  }
  .level-stars {
    margin-top: 10px;
    font-size: 1.1rem;
    letter-spacing: 3px;
    font-family: 'Baloo 2', cursive;
    line-height: 1;
  }
  .level-stars .on {
    color: var(--gold-deep);
    text-shadow: 0 0 10px rgba(245,197,66,0.8);
    display: inline-block;
    animation: starPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  .level-stars .on:nth-child(1) { animation-delay: 0.1s; }
  .level-stars .on:nth-child(2) { animation-delay: 0.2s; }
  .level-stars .on:nth-child(3) { animation-delay: 0.3s; }
  @keyframes starPop {
    from { transform: scale(0) rotate(-180deg); }
    to { transform: scale(1) rotate(0); }
  }
  .level-stars .off { color: #E5E7EB; }

  .lock-badge {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2rem;
    opacity: 0.9;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.3));
  }

  /* ===== GAME ===== */
  .progress-wrap {
    width: 100%;
    max-width: 700px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-bar {
    flex: 1;
    height: 16px;
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      inset 0 2px 5px rgba(180,120,180,0.15),
      0 2px 0 rgba(255,255,255,0.6);
    position: relative;
    border: 2px solid #fff;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rose) 0%, var(--orange) 50%, var(--gold) 100%);
    border-radius: 20px;
    width: 0%;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 12px rgba(255,179,71,0.6);
    position: relative;
    overflow: hidden;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    animation: shimmer 2s infinite;
  }
  .score-pill {
    background: linear-gradient(135deg, #FFF8D6, var(--gold));
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 800;
    font-family: 'Baloo 2', cursive;
    color: #7A5500;
    font-size: 0.88rem;
    box-shadow:
      0 4px 0 rgba(245,197,66,0.6),
      0 8px 20px rgba(245,197,66,0.3),
      inset 0 1px 0 rgba(255,255,255,0.8);
    white-space: nowrap;
    border: 2px solid rgba(255,255,255,0.95);
  }

  .question-card {
    background: rgba(255,255,255,0.92);

<script>
// ===== FORCE HIDE LOADING (fallback) =====
window.addEventListener('load', function() {
  setTimeout(function() {
    var ls = document.getElementById('loadingScreen');
    if (ls && !ls.classList.contains('hide')) {
      ls.classList.add('hide');
      setTimeout(function() { ls.style.display = 'none'; }, 700);
    }
  }, 6000);
});

// ===== SOUND =====
let audioCtx = null;
function beep(freq, dur, type) {
  type = type || 'sine';
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

const state = {
  screen: 'home',
  level: 0,
  question: 0,
  score: 0,
  correctCount: 0,
  stars: JSON.parse(localStorage.getItem('membaca_stars_v3') || '{}'),
  arranged: [],
  pool: [],
  answered: false,
  checking: false,
  lastStars: 0,
  lastCorrect: 0,
  lastTotal: 0
};

// ===== HELPERS =====
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function saveStars() {
  try { localStorage.setItem('membaca_stars_v3', JSON.stringify(state.stars)); } catch(e) {}
}
function isLevelUnlocked(idx) {
  if (idx === 0) return true;
  return (state.stars[idx - 1] || 0) >= 1;
}
function totalStars() {
  let t = 0;
  levels.forEach((_, i) => { t += (state.stars[i] || 0); });
  return t;
}
function maxStars() { return levels.length * 3; }

function spawnConfetti() {
  const emojis = ['🎉','⭐','✨','🌟','💖','🎊','🌈','💫','🌸'];
  for (let i = 0; i < 25; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (2.5 + Math.random() * 2) + 's';
    el.style.animationDelay = (Math.random() * 0.8) + 's';
    el.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}

// ===== RENDER =====
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'home') renderHome(app);
  else if (state.screen === 'game') renderGame(app);
  else if (state.screen === 'complete') renderComplete(app);
}

function renderHome(app) {
  const tStars = totalStars();
  const mStars = maxStars();

  app.innerHTML = `
    <div class="topbar">
      <div style="width:42px"></div>
      <div class="topbar-title">📖 Petualangan Membaca</div>
      <div class="star-pill">⭐ ${tStars}/${mStars}</div>
    </div>
    <div class="screen screen-enter">
      <div class="home-hero">
        <span class="mascot">📚</span>
        <h1>Petualangan Membaca</h1>
        <p>Kelas 1 SD • 8 permainan seru untuk belajar membaca! 🌈</p>
      </div>
      <div class="section-label">🎯 Pilih Permainanmu (8 Game)</div>
      <div class="level-grid">
        ${levels.map((lv, i) => {
          const s = state.stars[i] || 0;
          const unlocked = isLevelUnlocked(i);
          const starsHtml = [0,1,2].map(k =>
            `<span class="${k < s ? 'on' : 'off'}">★</span>`
          ).join('');
          return `
            <div class="level-card ${unlocked ? '' : 'locked'}" data-level="${i}">
              <div class="level-num">GAME ${i+1}</div>
              <span class="level-emoji">${lv.icon}</span>
              <div class="level-name">${lv.name}</div>
              <div class="level-desc">${unlocked ? lv.desc : '🔒 Selesaikan game sebelumnya'}</div>
              <div class="level-stars">${starsHtml}</div>
              ${unlocked ? '' : '<span class="lock-badge">🔒</span>'}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;

  app.querySelectorAll('.level-card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = parseInt(card.dataset.level);
      if (!isLevelUnlocked(idx)) {
        S.wrong();
        card.style.animation = 'shake 0.5s';
        setTimeout(() => card.style.animation = '', 500);
        return;
      }
      S.click();
      startLevel(idx);
    });
  });
}

function startLevel(levelIdx) {
  state.level = levelIdx;
  state.question = 0;
  state.score = 0;
  state.correctCount = 0;
  state.arranged = [];
  state.pool = [];
  state.answered = false;
  state.checking = false;
  state.screen = 'game';
  render();
}

function renderGame(app) {
  const lv = levels[state.level];
  const q = lv.questions[state.question];
  const total = lv.questions.length;
  const progress = (state.question / total) * 100;

  if (q.type === 'arrange' && state.pool.length === 0) {
    state.pool = shuffle(q.words.map((w, i) => ({ text: w, idx: i })));
  }

  let questionHtml = '';

  if (q.type === 'choice') {
    questionHtml = `
      <div class="question-card">
        <div class="q-prompt">${q.prompt}</div>
        <span class="q-emoji">${q.emoji}</span>
        <div class="options">
          ${q.options.map((opt, i) =>
            `<button class="option" data-opt="${i}">${opt}</button>`
          ).join('')}
        </div>
      </div>
    `;
  } else if (q.type === 'arrange') {
    questionHtml = `
      <div class="question-card">
        <div class="q-prompt">${q.prompt}</div>
        <div class="sentence-area" id="sentenceArea">
          ${state.arranged.map((origIdx, pos) =>
            `<span class="word-chip" data-pos="${pos}">${q.words[origIdx]}</span>`
          ).join('')}
        </div>
        <div class="word-pool" id="wordPool">
          ${state.pool.map(p => {
            const used = state.arranged.includes(p.idx);
            return `<span class="word-chip ${used ? 'used' : ''}" data-idx="${p.idx}">${p.text}</span>`;
          }).join('')}
        </div>
      </div>
    `;
  } else if (q.type === 'story') {
    questionHtml = `
      <div class="question-card">
        <div class="story-box">${q.story}</div>
        <div class="q-prompt">${q.prompt}</div>
        <div class="options">
          ${q.options.map((opt, i) =>
            `<button class="option" data-opt="${i}">${opt}</button>`
          ).join('')}
        </div>
      </div>
    `;
  } else if (q.type === 'readImage') {
    questionHtml = `
      <div class="question-card">
        <div class="q-prompt">${q.prompt}</div>
        <div class="read-word">
          <div class="label">📖 Baca kata berikut</div>
          <div class="word">${q.word}</div>
        </div>
        <div class="image-options">
          ${q.options.map((opt, i) =>
            `<button class="image-option" data-opt="${i}" title="${opt.t}">${opt.e}</button>`
          ).join('')}
        </div>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="topbar">
      <button class="btn-icon" id="btnHome" title="Menu">🏠</button>
      <div class="topbar-title">${lv.icon} ${lv.name}</div>
      <div class="star-pill">⭐ ${state.score}</div>
    </div>
    <div class="screen screen-enter">
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        <div class="score-pill">⭐ ${state.score}</div>
      </div>
      ${questionHtml}
      <div class="feedback" id="feedback">
        <div class="feedback-box">
          <span class="feedback-emoji" id="fbEmoji">🎉</span>
          <div class="feedback-text" id="fbText">Hebat!</div>
          <div class="feedback-sub" id="fbSub"></div>
          <button class="btn-next" id="btnNext">Lanjut ➜</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnHome').addEventListener('click', () => {
    S.click();
    state.screen = 'home';
    render();
  });

  if (q.type === 'choice' || q.type === 'story') {
    app.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.answered) return;
        handleChoice(parseInt(btn.dataset.opt), q.answer, btn);
      });
    });
  } else if (q.type === 'readImage') {
    app.querySelectorAll('.image-option').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.answered) return;
        handleChoice(parseInt(btn.dataset.opt), q.answer, btn);
      });
    });
  } else if (q.type === 'arrange') {
    app.querySelectorAll('#wordPool .word-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        if (state.answered || state.checking) return;
        const idx = parseInt(chip.dataset.idx);
        if (state.arranged.includes(idx)) return;
        S.click();
        state.arranged.push(idx);
        render();
      });
    });
    app.querySelectorAll('#sentenceArea .word-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        if (state.answered || state.checking) return;
        S.click();
        const pos = parseInt(chip.dataset.pos);
        state.arranged.splice(pos, 1);
        render();
      });
    });

    if (state.arranged.length === q.words.length && !state.answered && !state.checking) {
      state.checking = true;
      setTimeout(() => {
        state.checking = false;
        checkArrange(q);
      }, 300);
    }
  }

  document.getElementById('btnNext').addEventListener('click', () => {
    S.click();
    hideFeedback();
    nextQuestion();
  });
}

function handleChoice(selected, answer, btn) {
  state.answered = true;
  const correct = selected === answer;
  const isImage = btn.classList.contains('image-option');
  const allOpts = document.querySelectorAll(isImage ? '.image-option' : '.option');
  allOpts.forEach(o => o.classList.add('disabled'));

  if (correct) {
    S.correct();
    btn.classList.add('correct');
    state.score += 10;
    state.correctCount++;
    showFeedback(true);
  } else {
    S.wrong();
    btn.classList.add('wrong');
    allOpts[answer].classList.add('correct');
    showFeedback(false);
  }
}

function checkArrange(q) {
  if (state.answered) return;
  state.answered = true;
  const userSentence = state.arranged.map(i => q.words[i]);
  const correct = JSON.stringify(userSentence) === JSON.stringify(q.words);
  if (correct) {
    S.correct();
    state.score += 10;
    state.correctCount++;
    showFeedback(true);
  } else {
    S.wrong();
    showFeedback(false);
  }
}

function showFeedback(correct) {
  const fb = document.getElementById('feedback');
  const emoji = document.getElementById('fbEmoji');
  const text = document.getElementById('fbText');
  const sub = document.getElementById('fbSub');
  const isLast = state.question >= levels[state.level].questions.length - 1;

  if (correct) {
    const emojis = ['🎉','🌟','👏','💫','🏆','🎊','🌸'];
    const texts = ['Hebat!','Pintar!','Bagus sekali!','Keren!','Mantap!','Luar biasa!'];
    const i = Math.floor(Math.random() * emojis.length);
    emoji.textContent = emojis[i];
    text.textContent = texts[i];
    text.style.color = '#10B981';
    sub.textContent = '+10 poin ⭐';
    spawnConfetti();
  } else {
    emoji.textContent = '😅';
    text.textContent = 'Belum tepat!';
    text.style.color = '#EF4444';
    sub.textContent = 'Ayo coba lagi ya!';
  }

  document.getElementById('btnNext').textContent = isLast ? 'Selesai 🏁' : 'Lanjut ➜';
  fb.classList.add('show');
}

function hideFeedback() {
  const fb = document.getElementById('feedback');
  if (fb) fb.classList.remove('show');
}

function nextQuestion() {
  const lv = levels[state.level];
  if (state.question >= lv.questions.length - 1) {
    const totalQ = lv.questions.length;
    const percent = state.correctCount / totalQ;
    let stars = 1;
    if (percent >= 0.6) stars = 2;
    if (percent >= 0.85) stars = 3;

    const prev = state.stars[state.level] || 0;
    if (stars > prev) state.stars[state.level] = stars;
    saveStars();

    state.lastStars = stars;
    state.lastCorrect = state.correctCount;
    state.lastTotal = totalQ;
    state.screen = 'complete';
    S.win();
    setTimeout(spawnConfetti, 200);
    setTimeout(spawnConfetti, 800);
    render();
    return;
  }
  state.question++;
  state.answered = false;
  state.checking = false;
  state.arranged = [];
  state.pool = [];
  render();
}

function renderComplete(app) {
  const lv = levels[state.level];
  const stars = state.lastStars;
  const starsHtml = [0,1,2].map(i =>
    `<span class="${i < stars ? 'on' : 'off'}">★</span>`
  ).join('');
  const isLastLevel = state.level >= levels.length - 1;

  let subtitle;
  if (stars === 3) subtitle = 'Sempurna! Kamu luar biasa! 🌟';
  else if (stars === 2) subtitle = 'Bagus sekali! Sedikit lagi sempurna! 💪';
  else subtitle = 'Kerja bagus! Coba lagi untuk bintang lebih banyak! ✨';

  app.innerHTML = `
    <div class="topbar">
      <button class="btn-icon" id="btnHome">🏠</button>
      <div class="topbar-title">${lv.icon} ${lv.name}</div>
      <div style="width:42px"></div>
    </div>
    <div class="screen screen-enter">
      <div class="complete-card">
        <span class="complete-trophy">🏆</span>
        <div class="complete-title">Level Selesai!</div>
        <div class="complete-sub">
          Kamu menjawab <b>${state.lastCorrect}</b> dari <b>${state.lastTotal}</b> soal dengan benar<br>
          ${subtitle}
        </div>
        <div class="big-stars">${starsHtml}</div>
        <div class="complete-btns">
          <button class="btn-secondary" id="btnRetry">🔄 Ulangi</button>
          ${isLastLevel
            ? '<button class="btn-primary" id="btnHome2">🏠 Menu Utama</button>'
            : '<button class="btn-primary" id="btnNextLevel">Level Berikutnya ➜</button>'}
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnHome').addEventListener('click', () => {
    S.click(); state.screen = 'home'; render();
  });
  document.getElementById('btnRetry').addEventListener('click', () => {
    S.click(); startLevel(state.level);
  });
  const nextBtn = document.getElementById('btnNextLevel');
  if (nextBtn) nextBtn.addEventListener('click', () => {
    S.click(); startLevel(state.level + 1);
  });
  const homeBtn2 = document.getElementById('btnHome2');
  if (homeBtn2) homeBtn2.addEventListener('click', () => {
    S.click(); state.screen = 'home'; render();
  });
}

// ===== LOADING SCREEN =====
function runLoadingScreen() {
  const messages = [
    'Menyiapkan petualangan',
    'Mengumpulkan bunga',
    'Menyusun huruf ajaib',
    'Memanggil teman-teman',
    'Hampir siap'
  ];

  const screen = document.getElementById('loadingScreen');
  const bar = document.getElementById('loadBarFill');
  const textEl = document.getElementById('loadText');
  const percentEl = document.getElementById('loadPercent');

  if (!screen || !bar) return;

  let progress = 0;
  let msgIndex = 0;
  let done = false;

  setTimeout(() => percentEl.classList.add('show'), 200);

  const finish = () => {
    if (done) return;
    done = true;
    textEl.textContent = 'Ayo mulai! 🎉';
    setTimeout(() => {
      screen.classList.add('hide');
      setTimeout(() => {
        screen.style.display = 'none';
      }, 700);
    }, 400);
  };

  const interval = setInterval(() => {
    const step = progress < 30 ? 3.5 : progress < 75 ? 5.5 : 3;
    progress = Math.min(100, progress + step + Math.random() * 2);

    bar.style.width = progress + '%';
    percentEl.textContent = Math.floor(progress) + '%';

    const targetMsg = Math.min(
      messages.length - 1,
      Math.floor((progress / 100) * messages.length)
    );
    if (targetMsg !== msgIndex) {
      msgIndex = targetMsg;
      textEl.textContent = messages[msgIndex];
    }

    if (progress >= 100) {
      clearInterval(interval);
      finish();
    }
  }, 80);
}

// ===== INIT =====
render();
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', runLoadingScreen);
} else {
  runLoadingScreen();
}
</script>
