<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFD3E0">
<title>🌹 Petualangan Angka - Kelas 1 Ceria</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ====== PREMIUM COLOR SYSTEM (sama dengan landing page) ====== */
  :root {
    --bg-1: #FFD3E0;
    --bg-2: #FFE8CC;
    --bg-3: #FFF4D6;
    --bg-4: #E8F4FF;
    --bg-5: #D6F0FF;

    --rose: #FF6B9D;
    --rose-deep: #E84A7F;
    --orange: #FFB347;
    --orange-deep: #E8952E;
    --sky: #7DD3FC;
    --sky-deep: #38BDF8;
    --gold: #F5C542;
    --gold-deep: #D4A017;
    --mint: #5EC4C4;
    --mint-deep: #3AA8A8;
    --lavender: #A78BFA;
    --lavender-deep: #8B5CF6;

    --text: #3D3D5C;
    --text-soft: #6B6B8A;
    --text-muted: #9191A8;

    --shadow-rose: 0 8px 24px rgba(255,107,157,0.25);
    --shadow-orange: 0 8px 24px rgba(255,179,71,0.25);
    --shadow-sky: 0 8px 24px rgba(125,211,252,0.25);
    --shadow-gold: 0 8px 24px rgba(245,197,66,0.3);
    --shadow-mint: 0 8px 24px rgba(94,196,196,0.25);
    --shadow-lavender: 0 8px 24px rgba(167,139,250,0.25);

    --glass: rgba(255,255,255,0.7);
    --glass-border: rgba(255,255,255,0.9);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Quicksand', 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg,
      var(--bg-1) 0%,
      var(--bg-2) 15%,
      var(--bg-3) 35%,
      var(--bg-4) 60%,
      var(--bg-5) 80%,
      #FFF2D9 100%);
    color: var(--text);
    min-height: 100dvh; height: 100dvh;
    position: relative; overflow: hidden;
    touch-action: manipulation;
    font-weight: 600;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,255,255,0.5) 0%, transparent 30%),
      radial-gradient(circle at 90% 70%, rgba(255,255,255,0.35) 0%, transparent 35%);
    pointer-events: none;
    z-index: 1;
  }

  h1, h2, h3, h4 { font-family: 'Baloo 2', cursive; letter-spacing: -0.3px; }

  /* ===== BACKGROUND ===== */
  .bg-layer { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }

  .sun-wrap { position: absolute; top: clamp(15px, 4vw, 30px); right: clamp(15px, 4vw, 40px); width: clamp(55px, 12vw, 90px); height: clamp(55px, 12vw, 90px); }
  .sun-core {
    position: absolute; inset: clamp(8px, 2vw, 15px);
    background: radial-gradient(circle at 35% 35%, #FFF8D6 0%, var(--gold) 45%, var(--orange-deep) 100%);
    border-radius: 50%;
    box-shadow:
      0 0 50px rgba(245,197,66,0.85),
      0 0 100px rgba(255,179,71,0.5),
      inset -4px -4px 12px rgba(232,149,46,0.4);
    animation: sunPulse 3s ease-in-out infinite;
  }
  @keyframes sunPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .sun-rays { position: absolute; inset: 0; animation: raysSpin 30s linear infinite; }
  .sun-rays::before, .sun-rays::after { content: ''; position: absolute; top: 50%; left: 50%; width: clamp(55px, 12vw, 90px); height: 3px; background: linear-gradient(90deg, rgba(245,197,66,0.75), transparent); transform-origin: left center; border-radius: 2px; }
  .sun-rays::before { transform: translate(-50%, -50%) rotate(0deg); }
  .sun-rays::after { transform: translate(-50%, -50%) rotate(90deg); }
  @keyframes raysSpin { to { transform: rotate(360deg); } }

  .cloud-bg {
    position: absolute;
    background: rgba(255,255,255,0.9);
    border-radius: 60px;
    opacity: 0.92;
    filter: drop-shadow(0 8px 20px rgba(255,182,217,0.35)) blur(0.4px);
    backdrop-filter: blur(4px);
  }
  .cloud-bg::before, .cloud-bg::after { content: ''; position: absolute; background: inherit; border-radius: 50%; }
  .cloud-bg::before { width: 55%; height: 130%; top: -65%; left: 15%; }
  .cloud-bg::after { width: 45%; height: 110%; top: -45%; left: 50%; }
  .cloud-a { top: 8%; left: -140px; width: clamp(80px, 18vw, 130px); height: clamp(28px, 6vw, 42px); animation: drift 40s linear infinite; }
  .cloud-b { top: 22%; left: -140px; width: clamp(60px, 13vw, 90px); height: clamp(20px, 4.5vw, 30px); animation: drift 55s linear infinite 5s; }
  .cloud-c { top: 14%; left: -140px; width: clamp(100px, 22vw, 160px); height: clamp(35px, 7vw, 50px); opacity: 0.75; animation: drift 65s linear infinite 18s; }
  .cloud-d { top: 35%; left: -140px; width: clamp(65px, 14vw, 100px); height: clamp(22px, 5vw, 34px); animation: drift 50s linear infinite 25s; }
  .cloud-e { top: 4%; left: -140px; width: clamp(50px, 11vw, 75px); height: clamp(18px, 4vw, 26px); opacity: 0.7; animation: drift 70s linear infinite 35s; }
  .cloud-f { top: 28%; left: -140px; width: clamp(80px, 17vw, 120px); height: clamp(28px, 6vw, 40px); opacity: 0.8; animation: drift 60s linear infinite 45s; }
  @keyframes drift { to { transform: translateX(calc(100vw + 200px)); } }

  .rainbow-bg {
    position: absolute;
    top: -20%; left: 50%;
    transform: translateX(-50%);
    width: clamp(280px, 70vw, 500px);
    height: clamp(280px, 70vw, 500px);
    border-radius: 50%;
    border: clamp(8px, 2vw, 15px) solid;
    border-color: var(--rose) transparent transparent transparent;
    opacity: 0.25;
    box-shadow:
      0 clamp(-8px, -2vw, -15px) 0 var(--orange),
      0 clamp(-16px, -4vw, -30px) 0 var(--gold),
      0 clamp(-24px, -6vw, -45px) 0 #A8E6A3,
      0 clamp(-32px, -8vw, -60px) 0 var(--sky),
      0 clamp(-40px, -10vw, -75px) 0 var(--lavender);
  }

  .bird { position: absolute; font-size: clamp(0.9rem, 2.5vw, 1.3rem); animation: birdFly linear infinite; opacity: 0.55; filter: drop-shadow(0 4px 8px rgba(255,107,157,0.2)); }
  @keyframes birdFly { 0% { transform: translate(-60px, 0); } 50% { transform: translate(50vw, -30px); } 100% { transform: translate(calc(100vw + 60px), 0); } }

  .butterfly { position: absolute; font-size: clamp(1.1rem, 3vw, 1.6rem); animation: flutterFly 18s ease-in-out infinite; filter: drop-shadow(0 6px 12px rgba(255,107,157,0.25)); }
  @keyframes flutterFly { 0%,100% { transform: translate(0,0) rotate(0); } 20% { transform: translate(60px,-40px) rotate(15deg); } 40% { transform: translate(120px,20px) rotate(-10deg); } 60% { transform: translate(60px,60px) rotate(10deg); } 80% { transform: translate(-30px,30px) rotate(-8deg); } }

  .twinkle {
    position: absolute;
    color: #FFF8D6;
    text-shadow: 0 0 10px var(--gold), 0 0 20px rgba(245,197,66,0.6);
    animation: twinkleAnim 3s infinite;
    font-size: clamp(0.7rem, 1.8vw, 0.9rem);
  }
  @keyframes twinkleAnim { 0%,100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } }

  .balloon-bg { position: absolute; font-size: clamp(1.5rem, 4vw, 2.2rem); animation: balloonUp linear infinite; filter: drop-shadow(0 6px 12px rgba(255,107,157,0.3)); }
  @keyframes balloonUp { 0% { transform: translateY(100vh) rotate(-8deg); opacity: 0; } 8% { opacity: 0.9; } 92% { opacity: 0.9; } 100% { transform: translateY(-100px) rotate(8deg); opacity: 0; } }

  .heart-float { position: absolute; font-size: clamp(0.9rem, 2.5vw, 1.3rem); animation: heartUp linear infinite; opacity: 0.65; filter: drop-shadow(0 4px 8px rgba(255,107,157,0.4)); }
  @keyframes heartUp { 0% { transform: translateY(100vh) scale(0.6); opacity: 0; } 15% { opacity: 0.75; } 85% { opacity: 0.75; } 100% { transform: translateY(-80px) scale(1); opacity: 0; } }

  /* Hills — warna premium soft */
  .hills { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; height: clamp(90px, 22vh, 180px); z-index: 2; pointer-events: none; }
  .hills svg { display: block; width: 100%; height: 100%; }

  #app {
    position: relative; z-index: 10; width: 100%;
    max-width: min(100%, 720px); margin: 0 auto;
    height: 100dvh; padding: clamp(8px, 2vw, 14px);
    padding-top: calc(clamp(8px, 2vw, 14px) + env(safe-area-inset-top, 0));
    padding-bottom: calc(clamp(8px, 2vw, 14px) + 44px + env(safe-area-inset-bottom, 0));
    display: flex; flex-direction: column; overflow: hidden;
  }

  .screen { display: none; flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .screen.active { display: flex; flex-direction: column; animation: screenIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes screenIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

  /* ===== TOP BAR — Glassmorphism Premium ===== */
  .top-bar { display: flex; justify-content: space-between; align-items: center; padding: clamp(4px, 1.5vw, 8px) clamp(2px, 1vw, 4px); margin-bottom: clamp(8px, 2vw, 12px); flex-shrink: 0; gap: clamp(6px, 2vw, 10px); }

  .stat-chip {
    display: flex; align-items: center; gap: clamp(4px, 1.5vw, 6px);
    background: linear-gradient(135deg, #FFF8D6, var(--gold));
    border: 2px solid rgba(255,255,255,0.95);
    border-radius: 25px;
    padding: clamp(4px, 1.2vw, 6px) clamp(10px, 3vw, 16px);
    font-weight: 800;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(0.8rem, 3.5vw, 0.95rem);
    color: #7A5500;
    box-shadow:
      0 4px 0 rgba(245,197,66,0.6),
      0 8px 20px rgba(245,197,66,0.35),
      inset 0 1px 0 rgba(255,255,255,0.9);
    min-height: 36px;
  }

  .icon-btn {
    background: rgba(255,255,255,0.9);
    border: 2px solid rgba(255,255,255,0.95);
    border-radius: 50%;
    width: clamp(38px, 11vw, 44px);
    height: clamp(38px, 11vw, 44px);
    font-size: clamp(1rem, 3.5vw, 1.2rem);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    color: var(--mint-deep);
    box-shadow:
      0 4px 0 rgba(94,196,196,0.35),
      0 8px 20px rgba(94,196,196,0.2),
      inset 0 1px 0 rgba(255,255,255,1);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    touch-action: manipulation;
  }
  .icon-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow:
      0 7px 0 rgba(94,196,196,0.4),
      0 12px 26px rgba(94,196,196,0.3),
      inset 0 1px 0 rgba(255,255,255,1);
  }
  .icon-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(94,196,196,0.4); }
  .icon-btn.muted { opacity: 0.55; }

  /* ===== HOME HEADER ===== */
  .home-header { text-align: center; padding: clamp(2px, 1vw, 5px) 0 clamp(8px, 2vw, 12px); flex-shrink: 0; }

  .rose-wrap {
    width: clamp(90px, 28vw, 140px);
    height: clamp(105px, 32vw, 160px);
    margin: 0 auto clamp(2px, 1vw, 4px);
    position: relative;
    animation: roseSway 4s ease-in-out infinite;
    transform-origin: bottom center;
    filter:
      drop-shadow(0 12px 24px rgba(255,107,157,0.35))
      drop-shadow(0 0 30px rgba(255,182,217,0.5));
  }
  @keyframes roseSway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .rose-wrap svg { width: 100%; height: 100%; overflow: visible; }
  .rose-wrap .petal-group { transform-origin: 100px 90px; animation: petalPulse 4s ease-in-out infinite; }
  @keyframes petalPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .rose-sparkle {
    position: absolute;
    font-size: clamp(0.7rem, 2vw, 1rem);
    animation: sparkleAnim 2.5s infinite;
    pointer-events: none;
    filter: drop-shadow(0 0 8px rgba(245,197,66,0.9));
  }
  .rose-sparkle:nth-child(2) { top: 10%; left: 5%; animation-delay: 0.5s; }
  .rose-sparkle:nth-child(3) { top: 30%; right: 0; animation-delay: 1.2s; }
  .rose-sparkle:nth-child(4) { top: 5%; right: 15%; animation-delay: 1.8s; }
  @keyframes sparkleAnim { 0%,100% { opacity: 0; transform: scale(0.5) rotate(0); } 50% { opacity: 1; transform: scale(1.2) rotate(180deg); } }

  .game-title {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1.4rem, 7vw, 2.3rem);
    font-weight: 800;
    color: #fff;
    text-shadow:
      3px 3px 0 var(--rose),
      5px 5px 0 var(--gold),
      7px 7px 24px rgba(255,107,157,0.4);
    letter-spacing: -0.8px;
    line-height: 1.1;
    margin-bottom: clamp(3px, 1vw, 6px);
    margin-top: clamp(3px, 1vw, 6px);
  }
  .game-subtitle { color: var(--text-soft); font-size: clamp(0.78rem, 3.2vw, 0.95rem); font-weight: 600; }

  /* ===== XP BAR ===== */
  .xp-bar-wrap { margin: clamp(10px, 3vw, 15px) auto clamp(12px, 3vw, 18px); max-width: min(100%, 380px); width: 100%; flex-shrink: 0; }
  .xp-info { display: flex; justify-content: space-between; font-size: clamp(0.72rem, 2.8vw, 0.85rem); font-weight: 700; color: var(--text-soft); margin-bottom: 6px; padding: 0 4px; gap: 8px; }
  .xp-info .lvl-badge { color: var(--rose); font-family: 'Baloo 2', cursive; font-size: clamp(0.85rem, 3.2vw, 1rem); }
  .xp-bar {
    height: clamp(14px, 4vw, 18px);
    background: rgba(255,255,255,0.9);
    border-radius: 15px;
    overflow: hidden;
    border: 2px solid #fff;
    box-shadow:
      0 4px 0 rgba(245,197,66,0.4),
      0 10px 24px rgba(245,197,66,0.25),
      inset 0 2px 5px rgba(180,120,180,0.1);
  }
  .xp-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rose), var(--orange), var(--gold));
    border-radius: 10px;
    transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    background-size: 200% 100%;
    animation: gradientMove 3s linear infinite;
    box-shadow: 0 0 15px rgba(255,179,71,0.6);
  }
  @keyframes gradientMove { to { background-position: 200% 0; } }

  /* ===== LEVEL GRID ===== */
  .levels-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: clamp(10px, 3vw, 14px);
    padding-bottom: clamp(20px, 5vw, 40px);
    flex-shrink: 0;
  }
  .level-btn {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border: 2px solid rgba(255,255,255,0.95);
    border-radius: clamp(18px, 5vw, 25px);
    padding: clamp(10px, 3vw, 14px) clamp(6px, 2vw, 10px) clamp(8px, 2vw, 12px);
    cursor: pointer;
    text-align: center;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    font-family: inherit;
    overflow: hidden;
    touch-action: manipulation;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: clamp(3px, 1vw, 5px);
    box-shadow:
      0 10px 0 rgba(0,0,0,0.04),
      0 20px 45px rgba(255,107,157,0.12),
      inset 0 1px 0 rgba(255,255,255,1);
  }
  .level-btn:not(.locked):hover {
    transform: translateY(-10px) rotate(-1deg) scale(1.02);
    box-shadow:
      0 18px 0 rgba(0,0,0,0.05),
      0 30px 60px rgba(255,107,157,0.2),
      inset 0 1px 0 rgba(255,255,255,1);
  }
  .level-btn:not(.locked):active { transform: translateY(-2px) scale(0.98); }

  .level-btn .lvl-num {
    position: absolute;
    top: clamp(5px, 1.5vw, 8px);
    left: clamp(6px, 2vw, 10px);
    width: clamp(22px, 6.5vw, 28px);
    height: clamp(22px, 6.5vw, 28px);
    background: linear-gradient(135deg, #FFF8D6, var(--gold));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: clamp(0.7rem, 2.8vw, 0.85rem);
    color: #7A5500;
    box-shadow: 0 2px 0 rgba(245,197,66,0.6);
    z-index: 2;
    font-family: 'Baloo 2', cursive;
  }

  .level-btn.locked::after {
    content: '🔒';
    position: absolute;
    top: clamp(5px, 1.5vw, 8px);
    right: clamp(6px, 2vw, 10px);
    width: clamp(24px, 7vw, 30px);
    height: clamp(24px, 7vw, 30px);
    background: rgba(255,255,255,0.95);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(0.75rem, 3vw, 0.95rem);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 3;
  }

  .level-btn .lvl-icon {
    font-size: clamp(1.6rem, 6.5vw, 2.2rem);
    display: block;
    filter: drop-shadow(0 8px 14px rgba(255,107,157,0.25));
    transition: transform 0.35s;
    line-height: 1;
    margin-top: clamp(4px, 1.5vw, 6px);
  }
  .level-btn:hover .lvl-icon { transform: scale(1.15) rotate(-8deg); }

  .level-btn .lvl-name {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(0.78rem, 3.2vw, 0.98rem);
    color: var(--text);
    line-height: 1.15;
  }

  .level-btn .lvl-stars { font-size: clamp(0.72rem, 2.8vw, 0.85rem); letter-spacing: 2px; color: var(--gold-deep); }

  .level-btn .lvl-desc {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: clamp(0.62rem, 2.5vw, 0.75rem);
    color: var(--text-muted);
    line-height: 1.25;
    padding: clamp(3px, 1vw, 5px) clamp(2px, 1vw, 4px) 0;
    border-top: 1px dashed rgba(0,0,0,0.08);
    margin-top: clamp(2px, 0.8vw, 4px);
    text-align: center;
  }

  .level-btn.locked { background: rgba(245,245,245,0.9) !important; cursor: not-allowed; opacity: 0.85; }
  .level-btn.locked .lvl-icon { filter: grayscale(0.85); opacity: 0.6; }
  .level-btn.locked .lvl-name { color: var(--text-muted); }
  .level-btn.locked .lvl-desc { color: #aaa; border-top-color: rgba(0,0,0,0.06); }

  /* ===== GAME HEADER ===== */
  .game-header { display: flex; align-items: center; gap: clamp(6px, 2vw, 10px); margin-bottom: clamp(8px, 2vw, 10px); flex-shrink: 0; }
  .game-progress-wrap { flex: 1; min-width: 0; }
  .game-progress-info { display: flex; justify-content: space-between; font-size: clamp(0.7rem, 2.8vw, 0.8rem); font-weight: 700; color: var(--text-soft); margin-bottom: 4px; gap: 6px; }
  .game-progress-bar {
    height: clamp(10px, 3vw, 14px);
    background: rgba(255,255,255,0.9);
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #fff;
    box-shadow:
      0 3px 0 rgba(94,196,196,0.4),
      inset 0 2px 5px rgba(180,120,180,0.1);
  }
  .game-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--mint), var(--mint-deep));
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 12px rgba(94,196,196,0.6);
  }

  /* ===== MINI STATS ===== */
  .game-stats { display: flex; gap: clamp(5px, 1.5vw, 8px); margin-bottom: clamp(8px, 2vw, 12px); justify-content: center; flex-wrap: wrap; flex-shrink: 0; }
  .mini-stat {
    display: flex; align-items: center; gap: clamp(3px, 1vw, 5px);
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(167,139,250,0.4);
    border-radius: 20px;
    padding: clamp(3px, 1.2vw, 5px) clamp(9px, 3vw, 14px);
    font-weight: 800;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(0.78rem, 3vw, 0.9rem);
    color: var(--lavender-deep);
    box-shadow:
      0 3px 0 rgba(167,139,250,0.5),
      0 8px 20px rgba(167,139,250,0.2),
      inset 0 1px 0 rgba(255,255,255,1);
    transition: 0.3s;
    min-height: 32px;
  }
  .mini-stat.combo-active {
    background: linear-gradient(135deg, #FFF8D6, var(--gold));
    border-color: rgba(255,255,255,0.95);
    color: #7A5500;
    box-shadow:
      0 3px 0 rgba(245,197,66,0.6),
      0 0 25px rgba(245,197,66,0.7),
      inset 0 1px 0 rgba(255,255,255,0.9);
    animation: comboPop 0.5s;
  }
  @keyframes comboPop { 0% { transform: scale(1); } 50% { transform: scale(1.15) rotate(-3deg); } 100% { transform: scale(1); } }

  .game-content { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* ===== TIMER ===== */
  .timer-wrap { position: absolute; top: clamp(6px, 2vw, 12px); right: clamp(6px, 2vw, 12px); width: clamp(42px, 12vw, 54px); height: clamp(42px, 12vw, 54px); z-index: 20; }
  .timer-wrap svg { width: 100%; height: 100%; }
  .timer-svg { transform: rotate(-90deg); }
  .timer-track { fill: none; stroke: rgba(255,255,255,0.8); stroke-width: 5; }
  .timer-progress { fill: none; stroke: var(--mint); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke 0.3s; filter: drop-shadow(0 0 6px rgba(94,196,196,0.6)); }
  .timer-progress.warning { stroke: var(--orange); filter: drop-shadow(0 0 6px rgba(255,179,71,0.6)); }
  .timer-progress.danger { stroke: var(--rose); animation: timerPulse 0.5s infinite; filter: drop-shadow(0 0 8px rgba(255,107,157,0.8)); }
  @keyframes timerPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .timer-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: clamp(0.85rem, 3.3vw, 1.1rem); font-family: 'Baloo 2', cursive; color: var(--text-soft); }

  /* ===== QUESTION CARD ===== */
  .question-card {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border: 2px solid rgba(255,255,255,0.95);
    border-radius: clamp(20px, 5vw, 30px);
    padding: clamp(20px, 5vw, 26px) clamp(12px, 3.5vw, 18px) clamp(14px, 3.5vw, 20px);

    min-height: clamp(180px, 44vw, 260px);
    display: flex; flex-direction: column;
    box-shadow:
      0 8px 0 rgba(94,196,196,0.15),
      0 20px 50px rgba(255,107,157,0.15),
      inset 0 1px 0 rgba(255,255,255,1);
    position: relative; flex-shrink: 0;
  }

  .q-ribbon {
    position: absolute;
    top: clamp(-14px, -3vw, -12px);
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, var(--rose), var(--orange));
    color: #fff;
    padding: clamp(3px, 1vw, 5px) clamp(14px, 4vw, 22px);
    border-radius: 20px;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(0.62rem, 2.6vw, 0.78rem);
    font-weight: 800;
    letter-spacing: 1.2px;
    box-shadow:
      0 4px 0 var(--rose-deep),
      0 8px 20px rgba(255,107,157,0.4),
      inset 0 1px 0 rgba(255,255,255,0.3);
    white-space: nowrap;
    text-transform: uppercase;
  }

  .q-body { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding-top: clamp(4px, 1.5vw, 6px); gap: clamp(10px, 3vw, 14px); min-height: 0; }
  .q-text { font-family: 'Baloo 2', cursive; font-size: clamp(1rem, 4.2vw, 1.35rem); font-weight: 700; color: var(--text); line-height: 1.35; text-align: center; max-width: 100%; word-wrap: break-word; }
  .q-text .q-name { color: var(--rose); text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: clamp(2px, 0.6vw, 4px); text-underline-offset: 3px; font-weight: 800; }
  .q-text .q-num { color: var(--mint-deep); font-weight: 800; font-size: 1.4em; padding: 0 2px; }
  .q-text .q-eq { color: var(--orange); font-weight: 800; padding: 0 4px; }

  .q-formula {
    display: flex; align-items: center; justify-content: center; gap: clamp(4px, 1.5vw, 10px);
    padding: clamp(8px, 2.5vw, 12px) clamp(8px, 2.5vw, 20px);
    background: linear-gradient(135deg, #FFF8D6, var(--bg-1));
    border: 2px dashed var(--orange);
    border-radius: clamp(14px, 4vw, 20px);
    font-family: 'Baloo 2', cursive; font-weight: 800;
    flex-wrap: nowrap;
  }
  .q-formula .num-box {
    background: linear-gradient(180deg, var(--mint), var(--mint-deep));
    color: #fff;
    padding: clamp(5px, 1.5vw, 8px) clamp(10px, 3vw, 18px);
    border-radius: clamp(10px, 2.5vw, 14px);
    font-size: clamp(1.2rem, 5vw, 1.9rem);
    min-width: clamp(42px, 11vw, 60px);
    text-align: center;
    box-shadow:
      0 4px 0 #2E8B7E,
      inset 0 1px 0 rgba(255,255,255,0.3);
    text-shadow: 0 2px 3px rgba(0,0,0,0.15);
  }
  .q-formula .op-box, .q-formula .eq-box { font-size: clamp(1.2rem, 5vw, 2rem); color: var(--rose); }
  .q-formula .eq-box { color: var(--orange); }
  .q-formula .q-box {
    background: #FFF;
    color: var(--rose);
    border: 2px dashed var(--rose);
    padding: clamp(5px, 1.5vw, 8px) clamp(10px, 3vw, 18px);
    border-radius: clamp(10px, 2.5vw, 14px);
    font-size: clamp(1.2rem, 5vw, 1.9rem);
    min-width: clamp(42px, 11vw, 60px);
    text-align: center;
  }

  .q-image-area {
    background: linear-gradient(135deg, #FFF8D6, var(--bg-1));
    border: 2px dashed var(--rose);
    border-radius: clamp(14px, 4vw, 20px);
    padding: clamp(12px, 3.5vw, 16px) clamp(10px, 2.5vw, 16px);
    width: 100%;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: clamp(4px, 1.5vw, 8px);
    min-height: clamp(70px, 18vw, 90px);
    position: relative;
  }
  .q-image-area::before {
    content: attr(data-label);

    top: -9px; left: clamp(10px, 3vw, 16px);
    background: #fff;
    padding: 0 8px;
    font-size: clamp(0.58rem, 2.2vw, 0.72rem);
    font-weight: 700;
    color: var(--rose);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    border-radius: 6px;
    white-space: nowrap;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .q-image-area .emoji-item {
    font-size: clamp(1.5rem, 6vw, 2.2rem);
    display: inline-block;
    animation: emojiPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
    filter: drop-shadow(0 4px 6px rgba(255,107,157,0.2));
    line-height: 1;
  }
  @keyframes emojiPop { from { transform: scale(0) rotate(-180deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  .q-image-area .emoji-item.crossed { opacity: 0.28; position: relative; }
  .q-image-area .emoji-item.crossed::after {
    content: '';
    position: absolute;
    top: 50%; left: -6%;
    width: 112%; height: 3px;
    background: var(--rose);
    transform: rotate(-25deg);
    border-radius: 2px;
  }
  .q-image-area .op-badge { font-family: 'Baloo 2', cursive; font-weight: 800; color: var(--rose); font-size: clamp(1.2rem, 5vw, 1.8rem); padding: 0 4px; align-self: center; }

  /* ===== TRAIN ===== */
  .q-train { display: flex; align-items: center; justify-content: center; gap: clamp(3px, 1vw, 6px); flex-wrap: wrap; }
  .q-train .t-slot {
    background: linear-gradient(180deg, var(--mint), var(--mint-deep));
    color: #fff;
    min-width: clamp(34px, 9vw, 46px);
    height: clamp(34px, 9vw, 46px);
    border-radius: clamp(10px, 2.5vw, 14px);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1rem, 4vw, 1.3rem);
    font-weight: 800;
    box-shadow:
      0 4px 0 #2E8B7E,
      inset 0 1px 0 rgba(255,255,255,0.3);
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    padding: 0 clamp(4px, 1.5vw, 8px);
  }
  .q-train .t-slot.empty {
    background: linear-gradient(135deg, #FFF8D6, var(--gold));
    color: #7A5500;
    border: 2px dashed var(--orange);
    box-shadow: none;
    animation: emptyBlink 1.2s infinite;
  }
  @keyframes emptyBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .q-train .t-arrow { color: var(--orange); font-size: clamp(0.9rem, 3vw, 1.2rem); }

  /* ===== COMPARE ===== */
  .q-compare { display: flex; gap: clamp(6px, 2vw, 10px); justify-content: center; align-items: stretch; width: 100%; flex-wrap: wrap; }
  .compare-side {
    background: linear-gradient(135deg, #FFF8D6, var(--bg-1));
    border: 2px solid var(--orange);
    border-radius: clamp(14px, 4vw, 20px);
    padding: clamp(6px, 2vw, 10px);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    flex: 1;
    min-width: 0;
    box-shadow:
      0 4px 0 var(--orange),
      0 10px 24px rgba(255,179,71,0.2),
      inset 0 1px 0 rgba(255,255,255,1);
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(3px, 1vw, 6px);
    touch-action: manipulation;
  }
  .compare-side:hover { transform: translateY(-4px); box-shadow: 0 9px 0 var(--orange), 0 18px 32px rgba(255,179,71,0.3); }
  .compare-side .c-label { font-family: 'Baloo 2', cursive; font-size: clamp(0.7rem, 2.6vw, 0.85rem); font-weight: 800; color: var(--rose); background: #fff; padding: 2px clamp(8px, 2.5vw, 12px); border-radius: 10px; white-space: nowrap; }
  .compare-side .emoji-box { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; font-size: clamp(1rem, 4vw, 1.35rem); padding: clamp(3px, 1vw, 6px); max-width: 100%; }
  .vs-badge { align-self: center; font-size: clamp(1.1rem, 4vw, 1.4rem); font-weight: 800; color: var(--rose); font-family: 'Baloo 2', cursive; animation: vsPulse 1.5s infinite; text-shadow: 2px 2px 0 var(--gold); flex-shrink: 0; }
  @keyframes vsPulse { 0%,100% { transform: scale(1) rotate(-5deg); } 50% { transform: scale(1.15) rotate(5deg); } }

  /* ===== TRAIN PLAY ===== */
  .q-train-play { display: flex; flex-direction: column; gap: clamp(8px, 2vw, 12px); align-items: center; width: 100%; }
  .train-track { display: flex; gap: clamp(4px, 1.2vw, 8px); justify-content: center; flex-wrap: wrap; }
  .train-car {
    background: linear-gradient(180deg, var(--gold), var(--orange));
    border: 2px solid var(--orange-deep);
    border-radius: clamp(12px, 3.5vw, 18px);
    padding: clamp(8px, 2.5vw, 12px) clamp(12px, 4vw, 22px);
    font-size: clamp(1.1rem, 4.5vw, 1.6rem);
    font-weight: 800;
    font-family: 'Baloo 2', cursive;
    color: #fff;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    min-width: clamp(42px, 11vw, 60px);
    box-shadow:
      0 5px 0 var(--orange-deep),
      inset 0 -2px 0 rgba(0,0,0,0.1),
      inset 0 1px 0 rgba(255,255,255,0.3);
    text-shadow: 0 2px 3px rgba(0,0,0,0.2);
    touch-action: manipulation;
  }
  .train-car:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 9px 0 var(--orange-deep), inset 0 -2px 0 rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.3); }
  .train-car:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--orange-deep); }
  .train-car.selected { opacity: 0.25; pointer-events: none; }
  .train-slot {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: clamp(42px, 11vw, 60px);
    height: clamp(40px, 11vw, 58px);
    background: linear-gradient(135deg, #FFF8D6, var(--gold));
    border-radius: clamp(12px, 3.5vw, 18px);
    border: 2px dashed var(--orange);
    font-size: clamp(1.1rem, 4.5vw, 1.6rem);
    font-weight: 800;
    font-family: 'Baloo 2', cursive;
    color: #7A5500;
    padding: 0 clamp(8px, 3vw, 14px);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .train-slot.filled {
    background: linear-gradient(180deg, var(--mint), var(--mint-deep));
    color: white;
    border: 2px solid #2E8B7E;
    box-shadow:
      0 5px 0 #2E8B7E,
      inset 0 1px 0 rgba(255,255,255,0.3);
    animation: fillPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes fillPop { from { transform: scale(0.5) rotate(-10deg); } to { transform: scale(1) rotate(0); } }
  .train-arrow { font-size: clamp(0.9rem, 3.5vw, 1.4rem); color: var(--orange); align-self: center; }

  /* ===== PICK ===== */
  .pick-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(4px, 1.5vw, 8px); }
  .pick-item {
    font-size: clamp(1.4rem, 5.5vw, 2rem);
    cursor: pointer;
    padding: clamp(3px, 1vw, 6px);
    border-radius: clamp(12px, 3.5vw, 18px);
    border: 2px solid transparent;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    opacity: 0.5;
    user-select: none;
    -webkit-user-select: none;
    filter: grayscale(50%);
    touch-action: manipulation;
  }
  .pick-item:hover { transform: scale(1.1); opacity: 0.9; }
  .pick-item.selected {
    border-color: var(--mint);
    background: rgba(224,247,245,1);
    opacity: 1;
    transform: scale(1.2);
    box-shadow: 0 0 20px rgba(94,196,196,0.6);
    filter: grayscale(0%);
  }

  /* ===== OPTIONS ===== */
  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(8px, 2.5vw, 12px); }
  .opt-btn {
    background: rgba(255,255,255,0.95);
    border: 2px solid rgba(245,197,66,0.5);
    color: #7A5500;
    padding: clamp(14px, 4.5vw, 22px);
    border-radius: clamp(18px, 5vw, 25px);
    font-size: clamp(1.4rem, 6vw, 2rem);
    font-weight: 800;
    font-family: 'Baloo 2', cursive;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow:
      0 5px 0 rgba(245,197,66,0.6),
      0 12px 26px rgba(245,197,66,0.2),
      inset 0 1px 0 rgba(255,255,255,1);
    min-height: clamp(52px, 14vw, 70px);
    touch-action: manipulation;
  }
  .opt-btn:hover:not(:disabled) {
    transform: translateY(-4px);
    box-shadow:
      0 9px 0 rgba(245,197,66,0.7),
      0 16px 32px rgba(245,197,66,0.3),
      inset 0 1px 0 rgba(255,255,255,1);
    background: linear-gradient(180deg, #FFFFFF, #FFF8D6);
  }
  .opt-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 3px 0 rgba(245,197,66,0.6); }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct {
    background: linear-gradient(180deg, #D1FAE5, #A7F3D0);
    border-color: #10B981;
    color: #065F46;
    box-shadow: 0 5px 0 #10B981, 0 0 30px rgba(16,185,129,0.5);
    animation: correctBounce 0.5s;
  }
  .opt-btn.wrong {
    background: linear-gradient(180deg, #FEE2E2, #FECACA);
    border-color: #EF4444;
    color: #991B1B;
    box-shadow: 0 5px 0 #EF4444;
    animation: shakeX 0.5s;
  }
  @keyframes correctBounce { 0% { transform: scale(1); } 40% { transform: scale(1.1) rotate(3deg); } 100% { transform: scale(1); } }
  @keyframes shakeX { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }

  /* ===== BUTTONS ===== */
  .btn-primary {
    background: linear-gradient(135deg, var(--rose), var(--orange));
    color: #fff;
    border: none;
    padding: clamp(11px, 3.5vw, 15px) clamp(22px, 7vw, 34px);
    border-radius: 50px;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(0.95rem, 3.8vw, 1.15rem);
    font-weight: 800;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow:
      0 6px 0 var(--rose-deep),
      0 14px 28px rgba(255,107,157,0.4),
      inset 0 -2px 0 rgba(0,0,0,0.08),
      inset 0 1px 0 rgba(255,255,255,0.3);
    text-shadow: 0 2px 3px rgba(0,0,0,0.15);
    touch-action: manipulation;
    min-height: 44px;
  }
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow:
      0 9px 0 var(--rose-deep),
      0 20px 36px rgba(255,107,157,0.5),
      inset 0 -2px 0 rgba(0,0,0,0.08),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .btn-primary:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 var(--rose-deep);
  }
  .btn-secondary {
    background: rgba(255,255,255,0.95);
    color: var(--mint-deep);
    border: 2.5px solid var(--mint);
    padding: clamp(11px, 3.5vw, 15px) clamp(20px, 6vw, 30px);
    border-radius: 50px;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(0.9rem, 3.6vw, 1.05rem);
    font-weight: 800;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow:
      0 5px 0 rgba(94,196,196,0.5),
      0 12px 24px rgba(94,196,196,0.2),
      inset 0 1px 0 rgba(255,255,255,1);
    touch-action: manipulation;
    min-height: 44px;
  }
  .btn-secondary:hover {
    transform: translateY(-3px);
    box-shadow:
      0 8px 0 rgba(94,196,196,0.6),
      0 16px 30px rgba(94,196,196,0.3),
      inset 0 1px 0 rgba(255,255,255,1);
    background: linear-gradient(180deg, #FFFFFF, rgba(224,247,245,1));
  }
  .btn-secondary:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(94,196,196,0.6);
  }

  /* ===== FEEDBACK ===== */
  .feedback-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 900; display: flex; align-items: center; justify-content: center; }
  .feedback-text {
    font-family: 'Baloo 2', cursive;

  .feedback-text.wrong { color: var(--rose); }

    color: var(--gold);

  }
  @keyframes feedbackPop { 0% { transform: scale(0) rotate(-20deg); opacity: 0; } 30% { transform: scale(1.3) rotate(5deg); opacity: 1; } 60% { transform: scale(1) rotate(0); opacity: 1; } 100% { transform: scale(1.2) rotate(0); opacity: 0; } }

  /* ===== RESULT ===== */
  .result-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: clamp(15px, 4vw, 25px) clamp(12px, 3vw, 20px); text-align: center; gap: clamp(8px, 2vw, 12px); }
  .result-rose {

    transform-origin: bottom center;
  }
  @keyframes resultBounce { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-15px) rotate(4deg); } }
  .result-title {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1.7rem, 7.5vw, 2.4rem);

  .result-stars { font-size: clamp(2.2rem, 10vw, 3.5rem); letter-spacing: clamp(4px, 1.5vw, 8px); filter: drop-shadow(0 4px 12px rgba(245,197,66,0.6)); }
  .result-stars span { display: inline-block; animation: starPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
  @keyframes starPop { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  .result-stats { display: flex; gap: clamp(6px, 1.8vw, 10px); flex-wrap: wrap; justify-content: center; }
  .result-stat {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border: 2px solid rgba(167,139,250,0.4);
    border-radius: clamp(14px, 4vw, 20px);
    padding: clamp(8px, 2.5vw, 12px) clamp(12px, 4vw, 20px);
    min-width: clamp(70px, 20vw, 95px);
    box-shadow:
      0 5px 0 rgba(167,139,250,0.5),
      0 12px 26px rgba(167,139,250,0.2),
      inset 0 1px 0 rgba(255,255,255,1);

function loadSave() {

    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { stars: {}, coins: 0, xp: 0, level: 1, unlocked: 1 };
}
function persistSave() {
  try { localStorage.setItem('mathGameSave', JSON.stringify(save)); } catch(e) {}
}
var save = loadSave();

function rand(a,b) { return Math.floor(Math.random()*(b-a+1))+a; }
function shuffle(arr) {
  var a = arr.slice();
  for (var i=a.length-1;i>0;i--) { var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

var EMOJI_LIST = [
  { e: '🍎', n: 'apel' }, { e: '🍌', n: 'pisang' }, { e: '🍇', n: 'anggur' },
  { e: '🍓', n: 'stroberi' }, { e: '🍊', n: 'jeruk' }, { e: '🍒', n: 'ceri' },
  { e: '🌸', n: 'bunga sakura' }, { e: '🌷', n: 'bunga tulip' }, { e: '🌹', n: 'bunga mawar' },
  { e: '🌺', n: 'bunga sepatu' }, { e: '🌻', n: 'bunga matahari' }, { e: '🌼', n: 'bunga daisy' },
  { e: '🦋', n: 'kupu-kupu' }, { e: '⭐', n: 'bintang' }, { e: '🎈', n: 'balon' }
];
function pickEmojiObj() { return EMOJI_LIST[rand(0, EMOJI_LIST.length-1)]; }

function shuffle4(answer, min, max) {
  var opts = [answer], tries = 0;
  while (opts.length < 4 && tries < 100) {
    var c = answer + rand(-3, 3);
    if (c >= min && c <= max && opts.indexOf(c) === -1) opts.push(c);
    tries++;
  }
  var fill = 0;
  while (opts.length < 4 && fill < 50) {
    var n = rand(min, max);
    if (opts.indexOf(n) === -1) opts.push(n);
    fill++;
  }
  return shuffle(opts);
}

var audioCtx = null, soundEnabled = true;
function initAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } }
function beep(freq, dur, type, vol) {
  if (!soundEnabled) return;
  try {
    initAudio(); if (!audioCtx) return;
    var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type || 'sine'; osc.frequency.value = freq;
    osc.connect(gain); gain.connect(audioCtx.destination);
    var v = vol || 0.12;
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(v, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.2));
    osc.start(); osc.stop(audioCtx.currentTime + (dur || 0.2));
  } catch(e) {}
}

function startTimer(seconds) {
  stopTimer();
  game.timeLeft = seconds;
  var wrap = document.getElementById('timer-wrap');
  var num = document.getElementById('timer-num');
  var progress = document.getElementById('timer-progress');
  var total = 138;
  wrap.style.display = 'block';
  num.textContent = seconds;
  progress.setAttribute('stroke-dashoffset', '0');
  progress.classList.remove('warning', 'danger');
  game.timerId = setInterval(function() {
    game.timeLeft--;
    num.textContent = Math.max(0, game.timeLeft);
    var offset = total * (1 - game.timeLeft / seconds);
    progress.setAttribute('stroke-dashoffset', offset);
    if (game.timeLeft <= 5) progress.classList.add('danger');
    else if (game.timeLeft <= 9) progress.classList.add('warning');
    if (game.timeLeft <= 0) { stopTimer(); if (!game.locked) timeUp(); }
  }, 1000);
}
function stopTimer() {
  if (game.timerId) { clearInterval(game.timerId); game.timerId = null; }
  document.getElementById('timer-wrap').style.display = 'none';
}
function timeUp() {
  game.locked = true;
  game.combo = 0; updateComboDisplay();
  playWrong(); vibrate([50,50,50]);
  showFeedback('⏰', 'wrong');
  var all = document.querySelectorAll('.opt-btn');
  for (var i = 0; i < all.length; i++) {
    if (parseInt(all[i].textContent) === game.currentQuestion.answer) all[i].classList.add('correct');
  }
  game.currentQ++; updateProgress();
  setTimeout(nextQuestion, 1400);

var trainPicks = [], pickedCount = 0;

function renderQuestion(q) {
  var box = document.getElementById('question-box');
  var area = document.getElementById('answer-area');
  var ribbonHtml = q.ribbon ? '<div class="q-ribbon">' + q.ribbon + '</div>' : '';
  box.innerHTML = ribbonHtml + '<div class="q-body"><div class="q-text">' + q.text + '</div>' + (q.bodyHtml || '') + '</div>';
  if (q.type === 'options') {
    var html = '<div class="options">';
    for (var i = 0; i < q.options.length; i++) {
      html += '<button class="opt-btn" onclick="answerOption(this, ' + q.options[i] + ', ' + q.answer + ')">' + q.options[i] + '</button>';
    }
    html += '</div>';
    area.innerHTML = html;
  } else {
    area.innerHTML = '';
    if (q.type === 'train') trainPicks = [];
    if (q.type === 'pick') pickedCount = 0;
  }
}

function answerOption(btn, chosen, correct) {
  if (game.locked) return;
  game.locked = true; stopTimer();
  var all = document.querySelectorAll('.opt-btn');
  for (var i = 0; i < all.length; i++) all[i].disabled = true;
  if (chosen === correct) handleCorrect(btn);
  else handleWrong(btn, correct, all);
  game.currentQ++; updateProgress();
  setTimeout(nextQuestion, 1300);
}

function answerCompare(side, correctSide) {
  if (game.locked) return;
  game.locked = true; stopTimer();
  var sides = document.querySelectorAll('.compare-side');
  for (var i = 0; i < sides.length; i++) {
    if (sides[i].getAttribute('data-side') === correctSide) {
      sides[i].style.background = 'linear-gradient(180deg, #D1FAE5, #A7F3D0)';
      sides[i].style.borderColor = '#10B981';
      sides[i].style.boxShadow = '0 6px 0 #10B981';
    }
  }
  if (side === correctSide) handleCorrect(null);
  else {
    playWrong(); vibrate([60,60,60]);
    game.combo = 0; updateComboDisplay();
    showFeedback('❌', 'wrong');
    for (var j = 0; j < sides.length; j++) {
      if (sides[j].getAttribute('data-side') === side) {
        sides[j].style.background = 'linear-gradient(180deg, #FEE2E2, #FECACA)';
        sides[j].style.borderColor = '#EF4444';
        sides[j].style.boxShadow = '0 6px 0 #EF4444';
      }
    }
  }
  game.currentQ++; updateProgress();
  setTimeout(nextQuestion, 1300);
}

function pickTrain(el) {
  if (game.locked || el.classList.contains('selected')) return;
  playClick(); vibrate(15);
  el.classList.add('selected');
  var val = parseInt(el.getAttribute('data-val'));
  trainPicks.push(val);
  var slot = document.querySelector('#train-slots .train-slot[data-idx="' + (trainPicks.length - 1) + '"]');
  if (slot) { slot.textContent = val; slot.classList.add('filled'); }
  if (trainPicks.length === 4) {
    game.locked = true; stopTimer();
    var isCorrect = trainPicks.join(',') === game.currentQuestion.answer.join(',');
    setTimeout(function() {
      if (isCorrect) handleCorrect(null);
      else {
        playWrong(); vibrate([60,60,60]);
        game.combo = 0; updateComboDisplay();
        showFeedback('❌', 'wrong');
      }
      game.currentQ++; updateProgress();
      trainPicks = [];
      setTimeout(nextQuestion, 1000);
    }, 300);
  }
}

function togglePick(el) {
  if (game.locked) return;
  playClick(); vibrate(10);
  el.classList.toggle('selected');
  pickedCount = document.querySelectorAll('.pick-item.selected').length;
}

function submitPick(target) {
  if (game.locked) return;
  game.locked = true; stopTimer();
  if (pickedCount === target) handleCorrect(null);
  else {
    playWrong(); vibrate([60,60,60]);
    game.combo = 0; updateComboDisplay();
    showFeedback('❌', 'wrong');
  }
  game.currentQ++; updateProgress();
  pickedCount = 0;
  setTimeout(nextQuestion, 1100);
}

function handleCorrect(btnEl) {
  game.combo++; game.correctCount++;
  if (game.combo > game.maxCombo) game.maxCombo = game.combo;
  var points = 10 + Math.max(0, game.combo - 1) * 5;
  var coins = 5 + Math.max(0, game.combo - 1) * 2;
  game.score += points; game.levelCoins += coins;
  document.getElementById('score-val').textContent = game.score;
  document.getElementById('score-coins').textContent = game.levelCoins;
  updateComboDisplay();
  if (btnEl) btnEl.classList.add('correct');
  playCorrect(game.combo);
  if (game.combo >= 3) setTimeout(playCoin, 200);
  vibrate(30);
  showFeedback(game.combo >= 3 ? '🔥 COMBO x' + game.combo : '✅', 'correct');
  if (btnEl) burstFromElement(btnEl); else burstFromCenter();
}

function handleWrong(btnEl, correct, all) {
  game.combo = 0; updateComboDisplay();
  playWrong(); vibrate([60,60,60]);
  if (btnEl) btnEl.classList.add('wrong');
  showFeedback('❌', 'wrong');
  if (all) {
    for (var j = 0; j < all.length; j++) {
      if (parseInt(all[j].textContent) === correct) all[j].classList.add('correct');
    }
  }
}

function showFeedback(text, type) {
  var fb = document.getElementById('feedback-text');
  fb.textContent = text;
  fb.className = 'feedback-text ' + (type || '') + (text.indexOf('COMBO') >= 0 ? ' combo' : '');
  void fb.offsetWidth;
  fb.classList.add('show');
  setTimeout(function() { fb.classList.remove('show'); }, 1000);
}

function burstFromElement(el) { var rect = el.getBoundingClientRect(); burstAt(rect.left + rect.width/2, rect.top + rect.height/2); }
function burstFromCenter() { burstAt(window.innerWidth/2, window.innerHeight/2); }
function burstAt(cx, cy) {
  for (var i = 0; i < 16; i++) {
    var p = document.createElement('div');
    p.className = 'burst-particle';
    var angle = (Math.PI * 2 * i) / 16;
    var dist = 50 + Math.random() * 60;
    p.style.left = cx + 'px'; p.style.top = cy + 'px';
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    p.style.background = ['#F5C542','#5EC4C4','#FF6B9D','#A78BFA','#FFB347','#7DD3FC'][rand(0,5)];
    document.body.appendChild(p);
    (function(el) { setTimeout(function() { el.remove(); }, 900); })(p);
  }
}

function endLevel() {
  stopTimer();
  var correctRatio = game.correctCount / game.totalQ;
  var stars = correctRatio === 1 ? 3 : correctRatio >= 0.6 ? 2 : correctRatio >= 0.4 ? 1 : 0;
  if (stars > (save.stars[game.currentLevel.id] || 0)) save.stars[game.currentLevel.id] = stars;
  save.coins += game.levelCoins;
  save.xp += game.score;
  var oldLevel = save.level;
  save.level = 1 + Math.floor(save.xp / 100);
  var leveledUp = save.level > oldLevel;
  if (stars >= 1 && save.unlocked < game.currentLevel.id + 1 && game.currentLevel.id + 1 <= 8)
    save.unlocked = game.currentLevel.id + 1;
  persistSave();

  var resultHolder = document.getElementById('result-rose-holder');
  var roseClone = document.createElement('div');
  roseClone.style.width = '100%'; roseClone.style.height = '100%';
  roseClone.innerHTML = ROSE_SVG_HTML;
  resultHolder.innerHTML = '';
  resultHolder.appendChild(roseClone);

  document.getElementById('result-title').textContent =
    stars === 3 ? 'SEMPURNA!' : stars === 2 ? 'Hebat!' : stars === 1 ? 'Bagus!' : 'Coba Lagi ya!';
  var starsHtml = '';
  for (var i = 1; i <= 3; i++)
    starsHtml += '<span style="animation-delay:' + (i*0.25) + 's">' + (i <= stars ? '⭐' : '☆') + '</span>';
  document.getElementById('result-stars').innerHTML = starsHtml;
  document.getElementById('result-correct').textContent = game.score;
  document.getElementById('result-xp').textContent = '+' + game.score;
  document.getElementById('result-coins').textContent = '+' + game.levelCoins;

  showScreen('screen-result');
  if (stars >= 2) setTimeout(function() { launchConfetti(); playLevelUp(); }, 300);
  if (leveledUp) setTimeout(function() { showAchievement('⭐','LEVEL UP!','Kamu naik ke level ' + save.level); }, 800);
  else if (stars === 3) setTimeout(function() { showAchievement('🌹','PERFECT!','Semua jawaban benar!'); }, 800);
}

function launchConfetti() {
  var colors = ['#F5C542','#5EC4C4','#FF6B9D','#A78BFA','#F472B6','#7DD3FC','#FFB347','#FF69B4','#FF8FC7'];
  for (var i = 0; i < 60; i++) {
    var c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[rand(0, colors.length - 1)];
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    if (Math.random() > 0.5) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    (function(el) { setTimeout(function() { el.remove(); }, 4500); })(c);
  }
}

function showAchievement(icon, title, sub) {
  var toast = document.getElementById('achievement-toast');
  document.getElementById('ach-icon').textContent = icon;
  document.getElementById('ach-title').textContent = title;
  document.getElementById('ach-sub').textContent = sub;
  toast.classList.add('show');
  vibrate([100,50,100]);
  setTimeout(function() { toast.classList.remove('show'); }, 3500);
}

function resetProgress() {
  if (!confirm('Reset semua progress?')) return;
  save = { stars: {}, coins: 0, xp: 0, level: 1, unlocked: 1 };
  persistSave();
  renderHome();
}

try {
  renderHome();
  document.addEventListener('click', function once() {
    initAudio();
    document.removeEventListener('click', once);
  }, { once: true });
} catch(e) {
  var eb = document.getElementById('error-box');
  eb.style.display = 'block';
  eb.textContent = 'Init error: ' + e.message;
}
</script>
</body>
</html>
